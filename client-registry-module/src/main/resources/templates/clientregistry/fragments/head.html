<!--
  Local copy of identity-module's own identity/fragments/head.html (five lines: charset, viewport,
  title, clavaris.css link, ADR-0009 §3 brand-color hook) — same deliberate-duplication rationale
  organization-module's own local copy (organization/fragments/head.html) documents: no module here
  declares a Maven dependency on another bounded-context module, in main or test scope, which is
  exactly what a shared cross-module Thymeleaf fragment would otherwise require. A cross-module
  th:replace works in the app module's aggregated runtime classpath but breaks this module's own
  standalone-MockMvc controller tests, the established pattern in this codebase.

  Keep in sync with identity-module's identity/fragments/head.html and organization-module's own
  copy by hand if either changes — five lines, low churn, an explicit trade favoring per-module
  test self-containment over DRY.
-->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle}">Clavaris</title>
    <link rel="stylesheet" th:href="${#resourceUrl != null ? #resourceUrl.url('/css/clavaris.css') : '/css/clavaris.css'}"/>
    <link rel="icon" type="image/svg+xml" th:href="${#resourceUrl != null ? #resourceUrl.url('/brand/clavaris-mark-polished.svg') : '/brand/clavaris-mark-polished.svg'}"/>
    <style th:if="${branding != null and branding.primaryColor != null and branding.primaryColor.isPresent()}"
           th:text="':root { --clavaris-brand-color: ' + ${branding.primaryColor.get()} + '; }'">/* th:text overwrites this at render time — see ADR-0009 §3 */</style>
</head>
