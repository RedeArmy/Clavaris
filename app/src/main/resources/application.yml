# Base configuration — safe defaults for local development against the
# docker-compose stack (docker-compose.yml exposes Postgres/Redis on
# localhost). Real deployments must override every credential via env vars
# from .env (never commit real values — .env.example lists names only).

spring:
  application:
    name: clavaris
  datasource:
    url: jdbc:postgresql://${DB_DEV_HOST:localhost}:${DB_DEV_PORT:5432}/${DB_DEV_NAME:clavaris}
    username: ${DB_DEV_USER:clavaris}
    password: ${DB_DEV_PASSWORD:clavaris}
  jpa:
    open-in-view: false # never leak a persistence session implicitly into the web layer
    hibernate:
      # Flyway owns the schema (data-model.md §4) — Hibernate only ever verifies
      # entities match it, never creates or alters a table itself. "update" would
      # let dev/CI/prod schemas silently drift apart from each other; "validate"
      # fails loudly at startup instead.
      ddl-auto: validate
  flyway:
    # Default locations (classpath:db/migration) already match every module's
    # scaffolded db/migration folder — nothing to override here.
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # ADR-0020 Decision 4: one Clavaris-owned shared OAuth app per provider, not bring-your-own —
  # SocialLoginConfig (app) is what actually wires oauth2Login() against these registrations.
  # Dev-only placeholder defaults, same convention as signing-key-store.password/oauth2.token-hash-
  # secret above — confirmed live these can't be left blank like RESEND_API_KEY: Spring Boot's own
  # OAuth2ClientProperties.validate() unconditionally rejects an empty client-id for any *declared*
  # registration at ApplicationContext startup (a real, whole-app-breaking failure caught live, not
  # by inspection — every endpoint in the app failed, not just social login's own). The placeholder
  # values below satisfy that check without being real, working credentials — any actual
  # /oauth2/authorization/{google,github} attempt still fails cleanly against the provider itself
  # until real values are set.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:dev-only-google-client-id-change-in-real-deployments}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:dev-only-google-client-secret-change-in-real-deployments}
            # CommonOAuth2Provider.GOOGLE's own default scope (openid,profile,email) is already
            # exactly what ADR-0020 Decision 1 needs — a stable `sub` plus a genuinely verified
            # `email`/`email_verified` claim — no override needed.
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID:dev-only-github-client-id-change-in-real-deployments}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:dev-only-github-client-secret-change-in-real-deployments}
            # CommonOAuth2Provider.GITHUB's own default scope is read:user only — user:email added
            # explicitly: GitHubVerifiedEmailUserService's own GET /user/emails call (the only way
            # to learn whether a GitHub account's email is actually verified — the base /user
            # response has no verified flag at all) needs it, or the call comes back empty.
            scope: read:user,user:email
  # TD-ARCH-002 (closed): NOT spring.session.* — confirmed by inspecting the resolved
  # spring-boot-autoconfigure-4.1.0 jar directly that Spring Boot 4.x ships zero session-related
  # autoconfiguration classes (unlike the still-autoconfigured spring-boot-data-redis module
  # RedisFixedWindowRateLimiter already depends on, confirmed present in the same jar). Any
  # spring.session.* key here would be silently ignored, not a working config — DistributedSession
  # Config's explicit @EnableRedisIndexedHttpSession is the actual, load-bearing configuration.

# TD-SEC-002: TOKEN_SIGNING_KEY_STORE_PATH is now actually read — a PKCS12 file (SigningKeyStore)
# holding the platform tier's and every Organization's RSA private key material, so a process
# restart no longer regenerates every signing key and mass-invalidates every issued token. The
# dev-default path/password below are convenience-only, same convention as DB_DEV_*: never used in
# a real deployment, where both must be set explicitly.
clavaris:
  signing-key-store:
    path: ${TOKEN_SIGNING_KEY_STORE_PATH:./data/dev-signing-keys.p12}
    password: ${TOKEN_SIGNING_KEY_STORE_PASSWORD:dev-only-signing-key-store-password-change-in-real-deployments}
  # TD-SEC-004: ResendMailSender (identity-module) — email verification and password reset
  # delivery, via Resend's HTTP API. The sending domain behind MAIL_FROM_ADDRESS is provisioned
  # and DNS-verified with Resend separately (ADR-0011); no default for either value on purpose —
  # an unset RESEND_API_KEY should fail loudly against the real provider, not silently no-op.
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${MAIL_FROM_ADDRESS:}
  # ADR-0007: AesGcmWebhookSigningSecretCipher (webhook-module) — the one key every Organization's
  # every WebhookEndpoint signing secret is encrypted under at rest (WebhookSigningSecretCipher's
  # own Javadoc: this secret must be recoverable in cleartext at delivery time, so it can't be a
  # one-way hash). A compromise of this key exposes every Organization's every webhook signing
  # secret at once, so treat it with the same care as signing-key-store.password/oauth2.token-hash-
  # secret above.
  #
  # SDE-III review, 2026-09-04 — GitGuardian flagged a real secret here, correctly: unlike every
  # sibling dev-only literal in this file (all plain HMAC keys, which tolerate any string —
  # "dev-only-...-change-in-real-deployments" is deliberately unusable-looking), AesGcmWebhookSigning
  # SecretCipher needs a real, structurally-valid 256-bit AES key (base64, decodes to exactly 32
  # bytes) just to construct its SecretKeySpec at startup — a human-readable placeholder string
  # can't satisfy that. The previous default was a real, randomly-generated key, not a placeholder,
  # checked into source control — the exact class of exposure GitGuardian exists to catch. No real
  # deployment ever used it (this project hasn't launched, CLAUDE.md §11 — no Organization's real
  # webhook secret was ever encrypted under it), so there is no live ciphertext to re-encrypt, but
  # the value itself must never be trusted again. Replaced with a freshly generated key, used for
  # nothing but satisfying local dev/test startup — same "structurally required, dev-only, never a
  # real secret" status as every value below `dev-only-` in spirit, just base64-shaped instead of
  # human-readable because AES itself demands that. WEBHOOK_SECRET_ENCRYPTION_KEY is now listed in
  # .env.example (a real, separate gap — it was the one secret in this file missing from there),
  # with the same "generate and rotate independently, never commit a real value" instruction every
  # sibling secret already carries; any real deployment must set it explicitly regardless of what
  # this default is.
  webhook:
    secret-encryption-key: ${WEBHOOK_SECRET_ENCRYPTION_KEY:Ah1uNXa5LllyXt9HnJePrt1/3QLbDUG6SCRtFFwRSWc=}
  # TD-SEC-019: keys the HMAC-SHA256 digest HashedTokenOAuth2AuthorizationService computes for
  # every oauth2_authorization bearer token value before it reaches Postgres (BearerTokenHasher's
  # own Javadoc). The dev-only literal below is exactly that — never used in a real deployment,
  # same convention as signing-key-store.password above.
  oauth2:
    token-hash-secret: ${OAUTH2_TOKEN_HASH_SECRET:dev-only-oauth2-token-hash-secret-change-in-real-deployments}
    github:
      # GitHubVerifiedEmailUserService's own GET /user/emails call target (GitHubVerifiedEmailUser
      # Service's own Javadoc for why this call exists at all) — not part of Spring Boot's own
      # spring.security.oauth2.client.provider.github schema above, since that only covers the
      # standard OAuth2/OIDC endpoints and this is a GitHub-API-specific extra call with no
      # standard equivalent. Real GitHub API by default; SocialLoginIntegrationTest overrides this
      # to its own local stub server the same way it already overrides the provider's own
      # authorization-uri/token-uri/user-info-uri.
      emails-uri: ${GITHUB_EMAILS_API_URI:https://api.github.com/user/emails}
  # TD-SEC-023: keys the HMAC-SHA256 digest AntiAbuseRateLimitingFilter computes for every rate-limit
  # identifier (email, IP, client_id) before it becomes part of a Redis key (RateLimitKeyHasher's
  # own Javadoc) — a dedicated secret, deliberately not oauth2.token-hash-secret reused (see that
  # class for why). Same dev-only-literal convention as every secret above.
  #
  # TD-PROC-003: every tuning knob below already existed as an inline `@Value(...:default)` in Java
  # — functionally unchanged by this block (every value here matches its own code-side default
  # exactly), but previously undiscoverable without reading source across four config classes. An
  # operator can now find and override every one of these the normal Spring Boot way (edit this
  # file, or set the equivalent CLAVARIS_RATE_LIMIT_* env var — relaxed binding, no extra wiring
  # needed) instead of grepping `@Value`. ADR-0010 §6's own two-layer design: the anti-abuse rows
  # below (`login`/`token`/`platform-*`) are the fixed, system-defined layer no tenant can ever
  # loosen; `capacity.*` is the separate per-Organization capacity ceiling, operator-managed only
  # in v1 (self-service tuning is TD-FUT-002, deliberately deferred to v1.1).
  rate-limit:
    key-hash-secret: ${RATE_LIMIT_KEY_HASH_SECRET:dev-only-rate-limit-key-hash-secret-change-in-real-deployments}
    # Interactive login (both tiers — OrganizationAuthorizationServerConfig/PlatformDashboardSecurityConfig
    # share these same two property names), keyed per account and per IP (BR-ID credential-stuffing
    # defense, ADR-0010 §6.1).
    login:
      per-account-limit: 10
      per-ip-limit: 30
    # client_credentials/refresh-token exchange (per PlatformClient/OAuthClient).
    token:
      per-client-limit: 20
      refresh-per-client-limit: 600
    # Platform-tier self-service endpoints (PlatformDashboardSecurityConfig) — each its own row
    # rather than sharing token's own limit, since these are unauthenticated-by-design entry points
    # (registration, password reset) with their own real abuse shape.
    platform-register:
      per-ip-limit: 10
    platform-forgot-password:
      per-ip-limit: 10
    platform-create-organization:
      per-account-limit: 10
    # SocialLoginConfig's chain (ADR-0020) — IP-only, one shared limit across all four of its own
    # unauthenticated GET endpoints (initiate, provider callback, and both tiers' landing pages):
    # code review finding, this chain originally shipped with no AntiAbuseRateLimitingFilter at
    # all, unlike every sibling login-shaped chain.
    social-login:
      per-ip-limit: 30
    # /api/v1/admin/** (AdminApiSecurityConfig) — a blanket ceiling plus tighter, endpoint-specific
    # rows for the side-effect-bearing actions (real hard deletes, a real provisioned Account + a
    # real outbound email), same "side-effect-bearing endpoint gets its own tighter ceiling"
    # precedent BR-WS-04's own comment already documents.
    admin-api:
      per-client-limit: 120
      accounts-delete:
        per-client-limit: 30
      organizations-delete:
        per-client-limit: 5
      workspace-members-write:
        per-client-limit: 60
    # ADR-0010 §6.2: the per-Organization capacity ceiling — default-requests-per-minute is what
    # every Organization gets unless explicitly tuned (operator-only in v1, TD-FUT-002);
    # hard-cap-requests-per-minute is the system-wide maximum no operator override can ever exceed.
    #
    # TD-FUT-012 (closed 2026-09-02): policy-cache-ttl-seconds bounds how stale
    # OrganizationCapacityRateLimitingFilter's own RateLimitPolicy read is allowed to be —
    # CachingRateLimitPolicyRepository caches every read for this long, and additionally
    # write-throughs on every SetRateLimitPolicyController change, so this TTL only ever bounds the
    # (rare, operator-only) cold-start case, not a real staleness window on writes.
    capacity:
      default-requests-per-minute: 600
      hard-cap-requests-per-minute: 6000
      policy-cache-ttl-seconds: 30
  # TD-TEST-002: EventOutboxRetentionJob (identity-module)/OrganizationEventOutboxRetentionJob
  # (organization-module) sweep event_outbox/organization_event_outbox rows older than this many
  # days, daily. webhook-module's own dispatcher now exists (ADR-0007) and polls every few seconds
  # by default (clavaris.webhook.dispatch-fixed-delay-ms) — 90 days remains a wide, deliberate
  # safety margin around that real poll interval, not a "nothing reads this yet" placeholder
  # anymore; see either retention job's own Javadoc.
  event-outbox:
    retention-days: ${EVENT_OUTBOX_RETENTION_DAYS:90}
  # KnownDeviceRetentionJob's own sweep window, and RecordAccountLoginDeviceService's migration
  # grandfather cutoff (code review, 2026-09-01) — see either class's own Javadoc.
  known-device:
    retention-days: ${KNOWN_DEVICE_RETENTION_DAYS:400}
    migration-cutover-at: ${KNOWN_DEVICE_MIGRATION_CUTOVER_AT:2026-08-31T10:00:00Z}

# TD-SEC-017 / nfr-quality-attributes.md §5: real structured (JSON) logs, not just grep-able
# key=value text — Spring Boot's own native structured-logging support (no extra dependency;
# confirmed present in the resolved spring-boot-4.1.0 jar, org.springframework.boot.logging.
# structured.*), Elastic Common Schema chosen as a neutral, widely-ingestible default absent a
# more specific log-aggregation stack decision (still genuinely open — this is a format choice,
# not a commitment to any particular vendor/backend).
logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        # Never "*" — the full Actuator surface (env, beans, heapdump, ...) is a
        # real information-disclosure risk if exposed by default (BR-DATA-01
        # discipline extended to operational endpoints, not just app logs).
        # TD-FUT-011 / ADR-0015: "prometheus" added — a metrics *shape* dump
        # (counter/gauge/histogram names and values), not the env/beans/heapdump
        # surface this comment already refuses; carries no PII/credential values
        # by the same discipline every counter added for this feature follows
        # (SecurityMetrics's own Javadoc).
        include: health,info,prometheus
  metrics:
    tags:
      # Every metric this instance ever exports carries this tag — meaningful
      # once TD-FUT-013 (a real deployment artifact) makes "more than one
      # instance" a real scenario Prometheus needs to distinguish.
      application: clavaris
    distribution:
      percentiles-histogram:
        # Real p50/p95/p99 for every HTTP endpoint, not just averages — this is
        # what makes nfr-quality-attributes.md §3's own p95 < 300ms target for
        # /oauth2/token something Grafana/Alertmanager can actually watch,
        # instead of a number nobody measures continuously. Comes from
        # WebMvcMetricsFilter (auto-configured once micrometer-registry-
        # prometheus is on the classpath) — zero custom instrumentation needed
        # for this specific metric.
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      # TD-FUT-011 / ADR-0015: 100% — every request gets a trace, not a sample
      # of them. Defensible only at v1's actual traffic volume (single-digit
      # consumers, nfr-quality-attributes.md §3); revisit downward once real
      # traffic makes 100% sampling itself a real overhead, not before.
      probability: 1.0
    export:
      # Confirmed live against a real running instance, not assumed from the property name's own
      # shape: management.zipkin.tracing.endpoint (this project's first guess, matching the Boot
      # 3.x-era property name) resolves to nothing in Boot 4.1's real spring-boot-zipkin module —
      # its own spring-configuration-metadata.json shows the real key is nested under
      # management.tracing.export.zipkin.*, not management.zipkin.tracing.*. Traces were silently
      # sent to the property's own hardcoded Java-level default (localhost:9411, unreachable from
      # inside the "app" container) until this was caught by actually checking Zipkin's own
      # /api/v2/services for a result.
      zipkin:
        endpoint: ${CLAVARIS_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoint:
    health:
      # Kubernetes-style liveness/readiness groups — closes the health/readiness
      # gap flagged in nfr-quality-attributes.md §7. Exposes
      # /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      # Safe default: never leak DB/Redis connection details publicly.
      # application-dev.yml relaxes this for local debugging only.
      show-details: never
      group:
        # By default Spring Boot's "readiness" group only reflects
        # readinessState (has the app context finished starting?) — it does
        # NOT reflect downstream dependencies unless told to. Verified live
        # (docker compose): with Postgres killed, /actuator/health showed
        # "db": "DOWN" but /actuator/health/readiness still returned 200/UP.
        # An orchestrator watching only /readiness would keep routing traffic
        # to an instance that can't actually serve a request — exactly the
        # failure mode health checks exist to prevent. Explicitly folding db
        # and redis into the readiness group is what makes it meaningful.
        readiness:
          include: readinessState,db,redis
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# TD-SEC-015: makes the current, already-secure default an explicitly owned setting instead of an
# implicit one — Spring Boot's own default already suppresses these, but a future framework version
# changing that default, or a stray server.error.* override, would previously have gone unnoticed.
# GlobalExceptionHandler (app/infrastructure/config) is the owned safety net for the REST/JSON side
# of the codebase; this block is what backs the remaining Thymeleaf-rendered hosted-UI controllers,
# which fall through to Spring Boot's own BasicErrorController, never this project's own code.
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
