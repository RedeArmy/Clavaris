# Base configuration — safe defaults for local development against the
# docker-compose stack (docker-compose.yml exposes Postgres/Redis on
# localhost). Real deployments must override every credential via env vars
# from .env (never commit real values — .env.example lists names only).

spring:
  application:
    name: clavaris
  datasource:
    url: jdbc:postgresql://${DB_DEV_HOST:localhost}:${DB_DEV_PORT:5432}/${DB_DEV_NAME:clavaris}
    username: ${DB_DEV_USER:clavaris}
    password: ${DB_DEV_PASSWORD:clavaris}
  jpa:
    open-in-view: false # never leak a persistence session implicitly into the web layer
    hibernate:
      # Flyway owns the schema (data-model.md §4) — Hibernate only ever verifies
      # entities match it, never creates or alters a table itself. "update" would
      # let dev/CI/prod schemas silently drift apart from each other; "validate"
      # fails loudly at startup instead.
      ddl-auto: validate
  flyway:
    # Default locations (classpath:db/migration) already match every module's
    # scaffolded db/migration folder — nothing to override here.
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # TD-ARCH-002 (closed): NOT spring.session.* — confirmed by inspecting the resolved
  # spring-boot-autoconfigure-4.1.0 jar directly that Spring Boot 4.x ships zero session-related
  # autoconfiguration classes (unlike the still-autoconfigured spring-boot-data-redis module
  # RedisFixedWindowRateLimiter already depends on, confirmed present in the same jar). Any
  # spring.session.* key here would be silently ignored, not a working config — DistributedSession
  # Config's explicit @EnableRedisIndexedHttpSession is the actual, load-bearing configuration.

# TD-SEC-002: TOKEN_SIGNING_KEY_STORE_PATH is now actually read — a PKCS12 file (SigningKeyStore)
# holding the platform tier's and every Organization's RSA private key material, so a process
# restart no longer regenerates every signing key and mass-invalidates every issued token. The
# dev-default path/password below are convenience-only, same convention as DB_DEV_*: never used in
# a real deployment, where both must be set explicitly.
clavaris:
  signing-key-store:
    path: ${TOKEN_SIGNING_KEY_STORE_PATH:./data/dev-signing-keys.p12}
    password: ${TOKEN_SIGNING_KEY_STORE_PASSWORD:dev-only-signing-key-store-password-change-in-real-deployments}
  # TD-SEC-004: ResendMailSender (identity-module) — email verification and password reset
  # delivery, via Resend's HTTP API. The sending domain behind MAIL_FROM_ADDRESS is provisioned
  # and DNS-verified with Resend separately (ADR-0011); no default for either value on purpose —
  # an unset RESEND_API_KEY should fail loudly against the real provider, not silently no-op.
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${MAIL_FROM_ADDRESS:}
  # TD-SEC-019: keys the HMAC-SHA256 digest HashedTokenOAuth2AuthorizationService computes for
  # every oauth2_authorization bearer token value before it reaches Postgres (BearerTokenHasher's
  # own Javadoc). The dev-only literal below is exactly that — never used in a real deployment,
  # same convention as signing-key-store.password above.
  oauth2:
    token-hash-secret: ${OAUTH2_TOKEN_HASH_SECRET:dev-only-oauth2-token-hash-secret-change-in-real-deployments}

# TD-SEC-017 / nfr-quality-attributes.md §5: real structured (JSON) logs, not just grep-able
# key=value text — Spring Boot's own native structured-logging support (no extra dependency;
# confirmed present in the resolved spring-boot-4.1.0 jar, org.springframework.boot.logging.
# structured.*), Elastic Common Schema chosen as a neutral, widely-ingestible default absent a
# more specific log-aggregation stack decision (still genuinely open — this is a format choice,
# not a commitment to any particular vendor/backend).
logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        # Never "*" — the full Actuator surface (env, beans, heapdump, ...) is a
        # real information-disclosure risk if exposed by default (BR-DATA-01
        # discipline extended to operational endpoints, not just app logs).
        include: health,info
  endpoint:
    health:
      # Kubernetes-style liveness/readiness groups — closes the health/readiness
      # gap flagged in nfr-quality-attributes.md §7. Exposes
      # /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: true
      # Safe default: never leak DB/Redis connection details publicly.
      # application-dev.yml relaxes this for local debugging only.
      show-details: never
      group:
        # By default Spring Boot's "readiness" group only reflects
        # readinessState (has the app context finished starting?) — it does
        # NOT reflect downstream dependencies unless told to. Verified live
        # (docker compose): with Postgres killed, /actuator/health showed
        # "db": "DOWN" but /actuator/health/readiness still returned 200/UP.
        # An orchestrator watching only /readiness would keep routing traffic
        # to an instance that can't actually serve a request — exactly the
        # failure mode health checks exist to prevent. Explicitly folding db
        # and redis into the readiness group is what makes it meaningful.
        readiness:
          include: readinessState,db,redis
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
