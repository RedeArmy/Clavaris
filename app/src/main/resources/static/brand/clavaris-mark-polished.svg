<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Clavaris</title>
  <desc id="description">A polished shield and key mark for secure identity access.</desc>
  <defs>
    <linearGradient id="gold" x1="31" y1="17" x2="82" y2="93" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/><stop offset=".46" stop-color="#F59E0B"/><stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="shield" x1="25" y1="18" x2="87" y2="97" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27272A"/><stop offset="1" stop-color="#131316"/>
    </linearGradient>
  </defs>
  <rect width="112" height="112" rx="30" fill="#131316"/>
  <path d="M56 13 89 28.8v24.8C89 74.3 75.3 89.2 56 98 36.7 89.2 23 74.3 23 53.6V28.8L56 13Z" fill="url(#shield)" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M56 22.7 80 34.1v19.2c0 15.9-9.8 28.7-24 35.9-14.2-7.2-24-20-24-35.9V34.1l24-11.4Z" stroke="#FDE68A" stroke-opacity=".22" stroke-width="1"/>
  <!-- Key bow / identity lens: one high-contrast focal point, centred to the shield's axis. -->
  <!-- The key bow is a C: an ownable detail, naturally placed around the identity lens. -->
  <path d="M64.3 33.7A11.5 11.5 0 1 0 64.3 50.3" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="56" cy="42" r="5.2" fill="#131316"/>
  <circle cx="56" cy="42" r="2.1" fill="#FFF7ED"/>
  <!-- The stem and bit are deliberately wide so the key remains legible at 16–32px. -->
  <path d="M51.5 53h9v18.8h7.4v8.1h-7.4V85H47v-8.1h4.5V53Z" fill="url(#gold)"/>
  <path d="M61 62.7h5.6M61 75.3h5.6" stroke="#FDE68A" stroke-opacity=".48" stroke-width="1.3" stroke-linecap="round"/>
</svg>
