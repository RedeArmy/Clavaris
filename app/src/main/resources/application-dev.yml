# Local-only convenience overrides. Never used in a real deployment
# (SPRING_PROFILES_ACTIVE should never be "dev" outside a developer's machine).

management:
  endpoint:
    health:
      show-details: always # convenience for local debugging only — base application.yml keeps this "never"

logging:
  level:
    com.clavaris: DEBUG

# The one place the Swagger UI is served (see springdoc in application.yml).
springdoc:
  swagger-ui:
    enabled: true
