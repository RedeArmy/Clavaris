# DevDefaultSecretsStartupGuard refuses the public development secrets outside the dev/test
# profiles, and these tests intentionally run on application.yml's own defaults. Declared here, not
# in the pom's surefire block, so a test run from an IDE gets the same profile as Maven does.
spring.profiles.active=test

# The secret re-encryption sweep runs once a minute after startup in production, so a rotation
# finishes with its deploy. In a test run that is a job per Spring context competing for
# connections, and wall-clock-sensitive tests (the resend wait) feel it: the sweep has its own
# tests against Postgres, per store and for the job.
clavaris.crypto.reencrypt-initial-delay=P30D
