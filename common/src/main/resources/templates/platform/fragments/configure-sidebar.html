<!--
SDE-III review, 2026-09-19 (SonarCloud duplication fix, follow-up) — Clerk-style "Configure"
sub-navigation, one real shared copy in common/ rather than four hand-duplicated per-module
copies. Pure markup, no business logic (BR-agnostic navigation links only), so it fits common's
own "shared code only" scope the same way LocalizedDateFormatter does — every module that
renders a dashboard page already depends on common, and Spring's classpath-based Thymeleaf
resolution doesn't care which module's JAR a classpath:/templates/... resource actually lives in,
so this single file resolves identically from every one of the four consuming modules'
th:replace calls without any of them depending on each other (the dependency rule this whole
architecture is built around, §7.2, stays intact).

Every link is a real page navigation to a real, already-existing URL (Secret Keys/OAuth Clients/
Signing Keys/Webhook Endpoints each owned by their own module's own controller); Rate Limit and
Danger Zone are the two items promoted from organization-detail.html's own inline sections into
standalone pages of their own (organization-module), so every Configure destination now has the
same shape — a real page, not an inline fragment swap.

API Keys added 2026-09-24 (Clerk-parity read-only overview, PlatformOrganizationApiKeysController,
organization-module) — placed first, same position Clerk's own left nav gives it: the one page an
owner opens first when wiring up a new consumer, ahead of the individual credential-management
pages below it.

OAuth Clients moved to second (2026-09-24, live UX request) — the end-user login client is what
most owners configure right after checking their API Keys/issuer, ahead of Secret Keys (the
management-API credential, a less common first step for a brand-new Organization).

Workspace Roles added 2026-09-26 (ADR-0027 Slice 5, PlatformWorkspaceRoleController,
organization-module), removed 2026-10-02 (live UX request) in favor of the Teams & Roles "Roles"
section's own table (workspace-detail.html), restored again the same day (live UX request) — both
now coexist: this list stays the Configure-level, Workspace-independent view of every Organization
role, while that table additionally shows each role's own Team within one specific Workspace.
"Modify" and "Advanced create" there link into this controller's own create/detail pages too, now
carrying their own workspaceId so those pages' own Back/Cancel button returns there instead of
here (PlatformWorkspaceRoleController#populateBackTarget's own Javadoc).

Sessions added 2026-10-08 (Clerk "Sessions" settings parity, PlatformSessionPolicyController,
organization-module) — placed right after Workspace Roles, grouping the two Organization-wide
account-behavior policies (Workspace Roles, Sessions) ahead of the two capacity/API-shaped ones
(Rate Limit, Danger Zone).
-->
<aside th:fragment="sidebar(organizationId, active)" class="clavaris-configure-sidebar">
    <p class="clavaris-configure-sidebar__label">Configure</p>
    <a th:href="@{/platform/dashboard/organizations/{id}/api-keys(id=${organizationId})}"
       th:classappend="${active == 'api-keys'} ? 'active'" th:attr="aria-current=${active == 'api-keys'} ? 'page'">API Keys</a>
    <a th:href="@{/platform/dashboard/organizations/{id}/oauth-clients(id=${organizationId})}"
       th:classappend="${active == 'oauth-clients'} ? 'active'" th:attr="aria-current=${active == 'oauth-clients'} ? 'page'">OAuth Clients</a>
    <a th:href="@{/platform/dashboard/organizations/{id}/secret-keys(id=${organizationId})}"
       th:classappend="${active == 'secret-keys'} ? 'active'" th:attr="aria-current=${active == 'secret-keys'} ? 'page'">Secret Keys</a>
    <a th:href="@{/platform/dashboard/organizations/{id}/signing-keys(id=${organizationId})}"
       th:classappend="${active == 'signing-keys'} ? 'active'" th:attr="aria-current=${active == 'signing-keys'} ? 'page'">Signing Keys</a>
    <a th:href="@{/platform/dashboard/organizations/{id}/webhook-endpoints(id=${organizationId})}"
       th:classappend="${active == 'webhook-endpoints'} ? 'active'" th:attr="aria-current=${active == 'webhook-endpoints'} ? 'page'">Webhook Endpoints</a>
    <a th:href="@{/platform/dashboard/organizations/{id}/workspace-roles(id=${organizationId})}"
       th:classappend="${active == 'workspace-roles'} ? 'active'" th:attr="aria-current=${active == 'workspace-roles'} ? 'page'">Workspace Roles</a>
    <a th:href="@{/platform/dashboard/organizations/{id}/session-policy(id=${organizationId})}"
       th:classappend="${active == 'sessions'} ? 'active'" th:attr="aria-current=${active == 'sessions'} ? 'page'">Sessions</a>
    <a th:href="@{/platform/dashboard/organizations/{id}/rate-limit-policy(id=${organizationId})}"
       th:classappend="${active == 'rate-limit'} ? 'active'" th:attr="aria-current=${active == 'rate-limit'} ? 'page'">Rate Limit</a>
    <a th:href="@{/platform/dashboard/organizations/{id}/danger-zone(id=${organizationId})}"
       th:classappend="${active == 'danger-zone'} ? 'clavaris-configure-sidebar-danger active' : 'clavaris-configure-sidebar-danger'"
       th:attr="aria-current=${active == 'danger-zone'} ? 'page'">Danger Zone</a>
</aside>
