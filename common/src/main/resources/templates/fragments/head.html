<!--
The <head> of Clavaris's own server-rendered pages (platform auth pages, the dashboard,
the landing page): charset, viewport, title, the one stylesheet and the favicon. Previously four
identical per-module copies.

These are Clavaris's own pages, so they carry no tenant brand colour. A consuming application's
pages use fragments/consumer-head instead, which links the brand colour as a same-origin stylesheet
(an inline <style> is refused by style-src 'self'; TD-UX-001).
-->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle}">Clavaris</title>
    <link rel="stylesheet" th:href="${#resourceUrl != null ? #resourceUrl.url('/css/clavaris.css') : '/css/clavaris.css'}"/>
    <link rel="icon" type="image/svg+xml" th:href="${#resourceUrl != null ? #resourceUrl.url('/brand/clavaris-mark-polished.svg') : '/brand/clavaris-mark-polished.svg'}"/>
</head>
