<!--
The <head> of Clavaris's own server-rendered pages (platform auth pages, the dashboard,
the landing page): charset, viewport, title, the two stylesheets and the favicon. Previously four
identical per-module copies.

clavaris.css is what every page needs and clavaris-dashboard.css the rest (TD-FUT-048). A consuming
application's pages (fragments/consumer-head) link only the first, which is why the second is not
folded into it.

These are Clavaris's own pages, so they carry no tenant brand colour. A consuming application's
pages use fragments/consumer-head instead, which links the brand colour as a same-origin stylesheet
(an inline <style> is refused by style-src 'self'; TD-UX-001).
-->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- htmx writes a <style> for its .htmx-indicator rules at start-up, which style-src 'self'
         refuses (a CSP violation on every dashboard page). No template here uses .htmx-indicator;
         request states are styled in clavaris.css, so the injection is switched off. -->
    <meta name="htmx-config" content='{"includeIndicatorStyles":false}'/>
    <title th:text="${pageTitle}">Clavaris</title>
    <link rel="stylesheet" th:href="${#resourceUrl != null ? #resourceUrl.url('/css/clavaris.css') : '/css/clavaris.css'}"/>
    <link rel="stylesheet" th:href="${#resourceUrl != null ? #resourceUrl.url('/css/clavaris-dashboard.css') : '/css/clavaris-dashboard.css'}"/>
    <link rel="icon" type="image/svg+xml" th:href="${#resourceUrl != null ? #resourceUrl.url('/brand/clavaris-mark-polished.svg') : '/brand/clavaris-mark-polished.svg'}"/>
</head>
