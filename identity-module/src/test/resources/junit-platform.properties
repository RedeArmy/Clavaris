# TD-PROC-019: a test method (and a @BeforeAll/@BeforeEach) that runs longer than this is failed by
# JUnit, which interrupts it and names it, instead of holding the build until the CI job's own limit.
# The slowest legitimate method here is an integration test that starts a container, well under it.
# A hang outside any method, such as a Spring context that deadlocks while loading, is not covered
# by this; the Surefire fork timeout in the parent pom is the net for that.
junit.jupiter.execution.timeout.default = 10m
