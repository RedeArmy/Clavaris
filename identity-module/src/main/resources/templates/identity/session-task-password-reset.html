<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{identity/fragments/head :: head('Set a new password — Clavaris')}">
    <title>Set a new password — Clavaris</title>
</head>
<body>
<main>
    <div class="clavaris-card">
        <h1>Set a new password</h1>
        <p>Your administrator requires you to set a new password before you can continue.</p>

        <form th:action="@{''}" th:object="${form}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="clavaris-field">
                <label for="newPassword">New password</label>
                <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password" required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Password error</p>
            </div>

            <div class="clavaris-field">
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirmation error</p>
            </div>

            <button class="clavaris-button" type="submit">Set password</button>
        </form>
    </div>
</main>
</body>
</html>
