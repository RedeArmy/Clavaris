<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{identity/fragments/head :: head('Check your email — Clavaris')}">
    <title>Check your email — Clavaris</title>
</head>
<body>
<main>
    <div id="forgot-password-pending-content" th:fragment="content">
        <!-- Same dual-mode reasoning as forgot-password.html's own identical back-link pair — see
             that file's own comment for why. Reachable here via ForgotPlatformAccountPassword
             Controller's own redirect from a successful submission, htmx-followed transparently
             when the original submit came from inside the dialog. -->
        <a th:unless="${insideDialog}" class="clavaris-back-link" th:href="@{/platform/login}">
            <span aria-hidden="true">&larr;</span> <span>Back to login</span>
        </a>
        <a th:if="${insideDialog}" class="clavaris-back-link" href="#"
           th:attr="hx-get=@{/platform/account}" hx-target="#manage-account-dialog-body" hx-swap="innerHTML">
            <span aria-hidden="true">&larr;</span> <span>Back</span>
        </a>
        <div class="clavaris-card">
            <h1>Check your email</h1>
            <p>
                If a Clavaris account exists for that email address, we've sent a link to reset your
                password. The link expires in 30 minutes.
            </p>
        </div>
    </div>
</main>
</body>
</html>
