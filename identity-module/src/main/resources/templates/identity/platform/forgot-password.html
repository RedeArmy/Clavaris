<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{identity/fragments/head :: head('Forgot password — Clavaris')}">
    <title>Forgot password — Clavaris</title>
</head>
<body>
<main>
    <div id="forgot-password-content" th:fragment="content">
        <!-- Live UX bug, 2026-09-22: reached two ways — a real standalone page (from
             /platform/login's own "Forgot your password?" link) and, now, an htmx-swapped
             fragment inside the "Manage account" dialog's own Security tab ("Change password") —
             see ForgotPlatformAccountPasswordController's own Javadoc for the full dual-mode fix.
             The back target differs by which one this render actually is. -->
        <a th:unless="${insideDialog}" class="clavaris-back-link" th:href="@{/platform/login}">
            <span aria-hidden="true">&larr;</span> <span>Back to login</span>
        </a>
        <a th:if="${insideDialog}" class="clavaris-back-link" href="#"
           th:attr="hx-get=@{/platform/account}" hx-target="#manage-account-dialog-body" hx-swap="innerHTML">
            <span aria-hidden="true">&larr;</span> <span>Back</span>
        </a>
        <div th:replace="~{identity/fragments/forgot-password-form :: card(@{/platform/forgot-password}, ${insideDialog} ? '#manage-account-dialog-body' : null)}"></div>
    </div>
</main>
</body>
</html>
