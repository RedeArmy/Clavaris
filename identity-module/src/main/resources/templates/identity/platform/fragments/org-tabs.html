<!--
SDE-III review, 2026-09-19 — Clerk-style Organization detail navigation, this module's own copy.
Hand-duplicated across organization-module/client-registry-module/identity-module/webhook-module,
same convention this module's own dashboard-nav.html fragment already establishes: no module here
declares a Maven dependency on another, so a single shared fragment would only be reachable from
the app module's aggregated runtime classpath, not from any one module's own standalone-MockMvc
controller tests. "Users" is a plain link to the already-existing, separate
/platform/dashboard/organizations/{organizationId}/users page (this module's own) — not embedded
here. "Configure" links to Secret Keys, the same default landing item Clerk's own equivalent tab
uses (its screenshot's own "API keys" is the closest Clerk concept to a Secret Key here).

SDE-III refactor, 2026-09-22: organization-users.html used to carry its own one-off "Back to
{organizationName}" link (identity/platform/fragments/back-link.html) pointing at the Workspaces
tab — redundant with, and easily confused for, the tab row immediately below it, since Workspaces
is already one click away via the tabs themselves. Replaced with one generic "Back to Your
Organizations" link, defined once here (every one of this fragment's callers gets it — the four
top-level tabs and Configure's own five sub-pages alike) rather than re-added by hand per page, so
it never drifts out of sync with itself across tabs the way a per-page, per-organization-name link
could.

Live UX request, 2026-09-23: restyled as an actual button (clavaris-org-tabs__back) instead of
plain muted text (clavaris-back-link's own styling) — see that class's own comment in clavaris.css.
-->
<div th:fragment="tabs(organizationId, active)">
    <a class="clavaris-org-tabs__back" th:href="@{/platform/dashboard}">
        <span aria-hidden="true">&larr;</span> <span>Back to Your Organizations</span>
    </a>
    <div class="clavaris-org-tabs">
        <a th:href="@{/platform/dashboard/organizations/{id}(id=${organizationId})}"
           th:classappend="${active == 'workspaces'} ? 'active'">Workspaces</a>
        <a th:href="@{/platform/dashboard/organizations/{id}/users(id=${organizationId})}"
           th:classappend="${active == 'users'} ? 'active'">Users</a>
        <a th:href="@{/platform/dashboard/organizations/{id}/audit-log(id=${organizationId})}"
           th:classappend="${active == 'logs'} ? 'active'">Logs</a>
        <a th:href="@{/platform/dashboard/organizations/{id}/secret-keys(id=${organizationId})}"
           th:classappend="${active == 'configure'} ? 'active'">Configure</a>
    </div>
</div>
