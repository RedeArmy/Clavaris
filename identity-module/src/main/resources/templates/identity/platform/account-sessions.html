<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{identity/fragments/head :: head('Your sessions — Clavaris')}">
    <title>Your sessions — Clavaris</title>
</head>
<body>
<div class="clavaris-dashboard">
    <aside th:replace="~{identity/platform/fragments/dashboard-nav :: sidebar('sessions')}"></aside>
    <main class="clavaris-dashboard__content">
        <div class="clavaris-dashboard__inner">
            <div class="clavaris-page-header">
                <div>
                    <h1>Your Active Sessions</h1>
                    <p>These are the devices/browsers currently signed in to your Clavaris operator
                        account. If you don't recognize one, close it.</p>
                </div>
            </div>

            <!-- th:insert (not th:replace): this section's own class="clavaris-section
                 clavaris-session-list" styling must survive — th:replace would discard this tag
                 entirely and substitute the fragment's own bare <th:block> content in its place. -->
            <section class="clavaris-section clavaris-session-list"
                     th:insert="~{identity/fragments/sessions-table :: sessionsTable(${sessions}, ${friendlyDeviceLabels}, ${currentSessionId}, @{/platform/account/sessions})}"></section>
        </div>
    </main>
</div>
</body>
</html>
