<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head(${organizationName} + ' — Audit Log — Clavaris')}">
    <title>Audit Log — Clavaris</title>
</head>
<body>
<div class="clavaris-dashboard">
    <aside th:replace="~{platform/fragments/dashboard-nav :: sidebar('organizations')}"></aside>
    <main id="main-content" class="clavaris-dashboard__content">
        <div class="clavaris-dashboard__inner"
             th:with="accountLabel=${account.username().isPresent()} ? ${account.username().get().value()} : ${account.email().value()}">
            <div th:replace="~{platform/fragments/back-link :: back(@{/platform/dashboard/organizations/{organizationId}/users/{accountId}(organizationId=${organizationId},accountId=${account.id().value()})}, 'Back to Profile')}"></div>
            <p class="clavaris-breadcrumb">
                <a th:href="@{/platform/dashboard}">Organizations</a> <span class="clavaris-breadcrumb__sep" aria-hidden="true">/</span>
                <a th:href="@{/platform/dashboard/organizations/{id}(id=${organizationId})}" th:text="${organizationName}">Organization</a> <span class="clavaris-breadcrumb__sep" aria-hidden="true">/</span>
                <a th:href="@{/platform/dashboard/organizations/{id}/users(id=${organizationId})}">Users</a> <span class="clavaris-breadcrumb__sep" aria-hidden="true">/</span>
                <a th:href="@{/platform/dashboard/organizations/{organizationId}/users/{accountId}(organizationId=${organizationId},accountId=${account.id().value()})}" th:text="${accountLabel}">Account</a> <span class="clavaris-breadcrumb__sep" aria-hidden="true">/</span>
                <span>Audit Log</span>
            </p>

            <div class="clavaris-page-header">
                <div>
                    <h1>Audit Log</h1>
                    <p th:text="'Who changed what for ' + ${accountLabel} + ', newest first: profile edits, locks and bans, password resets, access to apps and sign-ins from new devices.'">Account audit log</p>
                </div>
            </div>

            <!-- SDE-III review, 2026-09-19 — same read-only, plain-bounded-list shape as
                 PlatformAuditLogController's own Organization-wide view (ADR-0025); the complement
                 to that view's own explicitly documented "Account events out of scope" limitation,
                 see GetAuditLogForAccountUseCase's own Javadoc.

Presented for the person reading it, not for an operator: the table is the shared
                 platform/fragments/audit-table (common), fed with AuditLogPresenter rows, so this
                 page and the Organization's Logs tab read the same way — a sentence per action,
                 "You" for the signed-in account, "This user" for what the viewed Account did
                 itself, relative time with the exact moment on hover, and the raw record one click
                 away in each row's collapsed "Technical details". -->
            <div class="clavaris-section">
                <div class="clavaris-section-card" th:if="${#lists.isEmpty(entries)}">
                    <p class="clavaris-empty-state">Nothing has been changed for this user yet. Profile edits, locks, password resets and similar actions will appear here.</p>
                </div>
                <div th:unless="${#lists.isEmpty(entries)}"
                     th:replace="~{platform/fragments/audit-table :: auditTable(${entries})}"></div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
