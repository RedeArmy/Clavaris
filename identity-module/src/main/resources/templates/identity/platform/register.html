<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{identity/fragments/head :: head('Create your Clavaris account')}">
    <title>Create your Clavaris account</title>
</head>
<body class="clavaris-auth-page">
<main>
    <div class="clavaris-card clavaris-card--auth">
        <a class="clavaris-auth-brand" th:href="@{/}" aria-label="Clavaris home">
            <img th:src="${#resourceUrl != null ? #resourceUrl.url('/brand/clavaris-logo-polished.svg') : '/brand/clavaris-logo-polished.svg'}" alt="Clavaris" width="198" height="42"/>
        </a>
        <div class="clavaris-auth-heading">
            <span class="clavaris-auth-heading__eyebrow">Platform console</span>
            <h1>Create your account</h1>
            <p>Start with identity infrastructure you control.</p>
        </div>

        <form th:action="@{''}" th:object="${form}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="clavaris-field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" autocomplete="email" required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
            </div>

            <div class="clavaris-field">
                <label for="password">Password</label>
                <!-- Same rationale as register.html's own identical fields. -->
                <input id="password" type="password" th:field="*{password}" autocomplete="new-password"
                       minlength="8" maxlength="128" required/>
                <p class="clavaris-field-hint" th:unless="${#fields.hasErrors('password')}">8–128 characters</p>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</p>
            </div>

            <div class="clavaris-field">
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirmation error</p>
            </div>

            <button class="clavaris-button" type="submit">Create account</button>
        </form>

        <!-- ADR-0020 Decision 2: Clavaris's own Sign Up is Google/GitHub/email, all three permanently
             available — same "always on, never tenant-configurable" shape login.html's own identical
             block already establishes for this tier. A first-time click here creates the
             PlatformAccount and logs in immediately (AuthenticatePlatformAccountWithSocialProviderService's
             own "brand-new signup" branch) — this is the same target login.html's own social buttons
             use, not a separate sign-up flow. -->
        <div class="clavaris-divider">Or</div>
        <div class="clavaris-social-options">
            <p><a class="clavaris-button clavaris-button--secondary clavaris-button--social" th:href="@{login/social/google}">
                <span th:replace="~{identity/fragments/social-icon-google :: icon}"></span>
                <span>Sign up with Google</span>
            </a></p>
            <p><a class="clavaris-button clavaris-button--secondary clavaris-button--social" th:href="@{login/social/github}">
                <span th:replace="~{identity/fragments/social-icon-github :: icon}"></span>
                <span>Sign up with GitHub</span>
            </a></p>
        </div>

        <p class="clavaris-links clavaris-links--split"><span>Already have an account?</span> <a th:href="@{login}">Sign in</a></p>
    </div>
</main>
</body>
</html>
