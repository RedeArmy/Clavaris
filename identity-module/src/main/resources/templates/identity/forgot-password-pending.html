<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Check your email — Clavaris')}">
    <title>Check your email — Clavaris</title>
</head>
<body>
<main>
    <div class="clavaris-card">
        <h1>Check your email</h1>
        <p>
            If an account exists for that email address, we've sent a link to reset your password.
            The link expires in 30 minutes.
        </p>
        <!--/* Back to the application the person came from; only rendered when the request named a
                client of this Organization (see ReturnToApplicationLink). */-->
        <div class="clavaris-return" th:if="${homeUrl}">
            <a class="clavaris-button clavaris-button--secondary" th:href="${homeUrl}">Back to home</a>
        </div>
    </div>
</main>
</body>
</html>
