<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Sign in — Clavaris</title>
</head>
<body>
<main>
    <h1>Sign in</h1>

    <p th:if="${loginError}">Invalid email or password.</p>
    <p th:if="${param.socialLoginError}">Something went wrong signing in — please try again.</p>

    <form th:action="@{''}" th:object="${form}" method="post" data-login-form>
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" required/>
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
        </div>

        <div>
            <label for="password">Password</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="current-password" required/>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</p>
        </div>

        <button type="submit">Sign in</button>
    </form>

    <!-- ADR-0020 Decision 3, BR-ID-12: only ever the providers this Organization has actually
         enabled — email/password above is never gated by this, always shown regardless. -->
    <div th:if="${not #lists.isEmpty(socialProviders)}">
        <p>Or sign in with:</p>
        <p th:each="provider : ${socialProviders}">
            <a th:href="@{'login/social/' + ${#strings.toLowerCase(provider.name())}}"
               th:text="${'Sign in with ' + #strings.capitalize(#strings.toLowerCase(provider.name()))}">Sign in with Provider</a>
        </p>
    </div>

    <p><a th:href="@{forgot-password}">Forgot your password?</a></p>
</main>
<!-- Code review finding (2026-09-01): client-side, same-origin-only cross-tab submit guard — see
     ContentSecurityPolicyHeaderWriter's own Javadoc and login-submit-guard.js's own header comment
     for the full rationale. -->
<script th:src="@{/js/login-submit-guard.js}" defer></script>
</body>
</html>
