<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/consumer-head :: consumerHead('Enter your code')}">
    <title>Enter your code</title>
</head>
<body>
<main>
    <div class="clavaris-card">
        <h1>Enter your code</h1>
        <p>We sent a 6-digit code to your email address. It expires in 10 minutes.</p>

        <p class="clavaris-alert clavaris-alert--error" role="alert" th:if="${codeError}">That code is invalid or has expired.</p>
        <p class="clavaris-alert clavaris-alert--error" role="alert" th:if="${deviceTrustChallengeUnavailable}">We couldn't send your device sign-in verification code right now — please try again in a moment.</p>

        <form th:action="@{''}" th:object="${form}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{email}"/>

            <div class="clavaris-field">
                <label for="code">Code</label>
                <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" th:field="*{code}" required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">Code error</p>
            </div>

            <button class="clavaris-button" type="submit">Sign in</button>
        </form>
    </div>
</main>
</body>
</html>
