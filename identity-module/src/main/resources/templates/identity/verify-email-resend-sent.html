<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/consumer-head :: consumerHead('Check your email')}">
    <title>Check your email</title>
</head>
<body>
<main>
    <div class="clavaris-card">
        <div class="clavaris-icon-circle clavaris-icon-circle--success" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6l8 6 8-6M4 6h16v12H4V6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h1>Check your email</h1>
        <!-- ADR-0038: the same words for every address, so this page says nothing about whether the
             address has an Account. Another message inside 30 seconds of the last one is not sent, and
             this page cannot tell the person that without telling them an Account exists, so it asks
             them to wait a moment instead. -->
        <p>
            If that address belongs to an account that still needs verifying, we've sent it a new
            message. It can take a minute to arrive; if you asked a moment ago, the one you already
            have still works.
        </p>

        <p class="clavaris-links" th:if="${codeEntry}">
            Got a code? <a th:href="@{../code(email=${email})}">Enter it here</a>.
        </p>
        <p class="clavaris-links"><a th:href="@{../../login}">Back to sign in</a></p>
    </div>
</main>
</body>
</html>
