<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/consumer-head :: consumerHead('Confirm your email')}">
    <title>Confirm your email</title>
</head>
<body>
<main>
    <div class="clavaris-card">
        <h1>Confirm your email</h1>
        <p>Confirm that this is your email address to finish verifying it.</p>
        <form method="post" th:action="@{/o/{organizationId}/verify-email(organizationId=${organizationId})}">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="token" th:value="${token}"/>
            <button class="clavaris-button" type="submit">Verify my email</button>
        </form>
    </div>
</main>
</body>
</html>
