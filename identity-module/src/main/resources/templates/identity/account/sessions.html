<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{identity/fragments/head :: head('Your sessions — Clavaris')}">
    <title>Your sessions — Clavaris</title>
</head>
<body>
<main>
    <div class="clavaris-card clavaris-card--wide">
        <p class="clavaris-breadcrumb">
            <a th:href="@{/o/{organizationId}/account/profile(organizationId=${organizationId})}">Update profile</a>
        </p>
        <h1>Your Active Sessions</h1>
        <p>These are the devices/browsers currently signed in to your account. If you don't recognize
            one, close it.</p>

        <div th:replace="~{identity/fragments/sessions-table :: sessionsTable(${sessions}, ${friendlyDeviceLabels}, ${currentSessionId}, @{/o/{organizationId}/account/sessions(organizationId=${organizationId})})}"></div>
    </div>
</main>
</body>
</html>
