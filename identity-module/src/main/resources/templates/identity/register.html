<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{identity/fragments/head :: head('Create an account — Clavaris')}">
    <title>Create an account — Clavaris</title>
</head>
<body>
<main>
    <div class="clavaris-card">
        <h1>Create an account</h1>
        <form th:action="@{''}" th:object="${form}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="clavaris-field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" autocomplete="email" required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
            </div>

            <!-- ADR-0024 §4: only ever shown when this Organization's own policy offers it, same
                 "policy computed fresh on every render" posture as login.html's own conditionals. -->
            <div class="clavaris-field" th:if="${usernameSignUpEnabled}">
                <label for="username">Username</label>
                <input id="username" type="text" th:field="*{username}" autocomplete="username"
                       th:required="${usernameRequired}"/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username error</p>
            </div>

            <!-- ADR-0024 §5: only shown when password sign-up is enabled — when it's off, sign-up
                 completes through a passwordless email method instead (see RegisterAccountController). -->
            <div class="clavaris-field" th:if="${passwordAtSignUpEnabled}">
                <label for="password">Password</label>
                <input id="password" type="password" th:field="*{password}" autocomplete="new-password"
                       required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</p>
            </div>
            <div class="clavaris-field" th:if="${passwordAtSignUpEnabled}">
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password"
                       required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirm password error</p>
            </div>

            <button class="clavaris-button" type="submit">Create account</button>
        </form>

        <!-- ADR-0020 Decision 3, BR-ID-12: only ever the providers this Organization has actually
             enabled — same "policy computed fresh on every render" posture as login.html's own
             identical block. A first-time click here creates the Account and logs in immediately
             (AuthenticateWithSocialProviderService's own "brand-new signup" branch) — this is the
             same target login.html's own social buttons use, not a separate sign-up flow. -->
        <div th:if="${not #lists.isEmpty(socialProviders)}">
            <div class="clavaris-divider">Or</div>
            <p th:each="provider : ${socialProviders}">
                <a class="clavaris-button clavaris-button--secondary clavaris-button--social"
                   th:href="@{'login/social/' + ${#strings.toLowerCase(provider.name())}}">
                    <!-- Same preprocessing-syntax rationale as login.html's own identical block. -->
                    <span th:replace="~{__${'identity/fragments/social-icon-' + #strings.toLowerCase(provider.name())}__ :: icon}"></span>
                    <span th:text="${'Sign up with ' + #strings.capitalize(#strings.toLowerCase(provider.name()))}">Sign up with Provider</span>
                </a>
            </p>
        </div>

        <p class="clavaris-links"><a th:href="@{login}">Already have an account? Sign in</a></p>
    </div>
</main>
</body>
</html>
