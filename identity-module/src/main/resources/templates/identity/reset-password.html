<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Reset password — Clavaris</title>
</head>
<body>
<main>
    <h1>Choose a new password</h1>

    <form th:action="@{''}" th:object="${form}" method="post">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{token}"/>

        <div>
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password" required/>
            <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Password error</p>
        </div>

        <div>
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required/>
            <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirmation error</p>
        </div>

        <button type="submit">Reset password</button>
    </form>
</main>
</body>
</html>
