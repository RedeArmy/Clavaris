<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{identity/fragments/head :: head('Sign in with a link — Clavaris')}">
    <title>Sign in with a link — Clavaris</title>
</head>
<body>
<main>
    <div class="clavaris-card">
        <h1>Sign in with an email link</h1>
        <p>Enter your email address and we'll send you a link to sign in.</p>

        <form th:action="@{''}" th:object="${form}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="clavaris-field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" autocomplete="email" required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
            </div>

            <button class="clavaris-button" type="submit">Send link</button>
        </form>

        <p class="clavaris-links"><a th:href="@{../}">Back to sign in</a></p>
    </div>
</main>
</body>
</html>
