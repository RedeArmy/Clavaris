<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/consumer-head :: consumerHead('Sign in with a link')}">
    <title>Sign in with a link</title>
</head>
<body>
<main>
    <div class="clavaris-card">
        <a class="clavaris-back-button" th:href="@{../}" aria-label="Back to sign in" title="Back to sign in"><svg class="clavaris-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>Back</span></a>
        <h1>Sign in with an email link</h1>
        <p>Enter your email address and we'll send you a link to sign in.</p>
        <p class="clavaris-alert clavaris-alert--error" role="alert" th:if="${deviceTrustChallengeUnavailable}">Your previous link worked, but we couldn't send your device sign-in verification code right now — please request a new link and try again.</p>

        <form th:action="@{''}" th:object="${form}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="clavaris-field">
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}" autocomplete="email" required/>
                <p class="clavaris-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
            </div>

            <button class="clavaris-button" type="submit">Send link</button>
        </form>
    </div>
</main>
</body>
</html>
