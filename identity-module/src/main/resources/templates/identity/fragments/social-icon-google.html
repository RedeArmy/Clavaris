<!--
  Google's standard four-color "G" mark — the same icon Clerk/Auth0/Okta's own hosted pages use next
  to a "Sign in/up with Google" label. Split into its own file (sibling: social-icon-github.html)
  rather than two th:fragment blocks in one file — every other fragment in this directory is
  one-file-one-fragment; splitting keeps that, and login.html/register.html can then select
  "social-icon-" + provider name directly (ADR-0020 Decision 3) without a second selector segment.

  Brand-defined colors, never recolored — unlike GitHub's mark (fill="currentColor"), Google's own
  guidelines fix these four hex values regardless of surrounding theme.

  aria-hidden: the button's own text label already says "Sign in with Google" — this is decorative,
  not a second, redundant accessible name.
-->
