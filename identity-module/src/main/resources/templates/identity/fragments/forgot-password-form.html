<!--
  Shared "forgot password" card — used identically by both the tenant-tier
  (identity/forgot-password.html) and platform-tier (identity/platform/forgot-password.html)
  pages. Both controllers bind the exact same RequestPasswordResetForm type (see
  ForgotPlatformAccountPasswordController's own Javadoc: "no tenant-specific field on it"), so the
  same th:field selection expression resolves unchanged against either page's own th:object scope.
  Found 100% duplicated verbatim between both pages (SonarCloud), not a false positive — extracted
  once the duplication was real, not assumed, same rationale
  identity/fragments/email-password-fields.html's own header comment documents for its own
  identical situation.
-->
<div class="clavaris-card" th:fragment="card">
    <h1>Forgot your password?</h1>
    <p>Enter your email address and we'll send you a link to reset your password.</p>

    <form th:action="@{''}" th:object="${form}" method="post">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="clavaris-field">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" required/>
            <p class="clavaris-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
        </div>

        <button class="clavaris-button" type="submit">Send reset link</button>
    </form>
</div>
