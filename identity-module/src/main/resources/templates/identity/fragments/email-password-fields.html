<!--
  Shared email/password field markup for the two password-login forms (tenant-tier login.html,
  platform-tier platform/login.html) — both bind an identical email/password shape onto their own
  form object (LoginForm/PlatformLoginForm), just under different types, so the exact same
  th:field selection expressions work unchanged against either one. Found duplicated verbatim
  between both pages after each independently gained the same clavaris-field styling classes;
  extracted once the duplication was real, not assumed.

  Referenced via Thymeleaf's own fragment-insertion expression from inside each page's own form
  element — inherits that form's current object selection, so it must only ever be inserted while
  a form object with email/password properties is selected, never on its own.
-->
<div th:fragment="fields">
    <div class="clavaris-field">
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" autocomplete="email" required/>
        <p class="clavaris-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
    </div>

    <div class="clavaris-field">
        <label for="password">Password</label>
        <input id="password" type="password" th:field="*{password}" autocomplete="current-password" required/>
        <p class="clavaris-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</p>
    </div>
</div>
