<!--
  Shared "new password"/"confirm new password" field pair — used identically by
  reset-password-form.html's own card (itself shared by the tenant-tier and platform-tier
  reset-password pages) and session-task-password-reset.html (the forced-password-reset flow).
  All three pages bind a form type exposing the same newPassword/confirmPassword property names
  (ConfirmPasswordResetForm for the first two, SessionTaskPasswordResetForm — itself extending the
  shared NewPasswordConfirmationForm base — for the third), so the same th:field selection
  expressions resolve unchanged against whichever one is currently selected — same "shared shape
  lets one fragment work unchanged against either type" reasoning email-password-fields.html's own
  header comment already documents for this file's sibling.

  Found 100% duplicated verbatim between reset-password-form.html and
  session-task-password-reset.html after both independently gained the same minlength/maxlength/
  hint additions in the same SDE-III review pass (SonarCloud) - extracted once the duplication was
  real, not assumed.
-->
<div th:fragment="fields">
    <div class="clavaris-field">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password"
               minlength="8" maxlength="128" required/>
        <p class="clavaris-field-hint" th:unless="${#fields.hasErrors('newPassword')}">8–128 characters</p>
        <p class="clavaris-field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Password error</p>
    </div>

    <div class="clavaris-field">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required/>
        <p class="clavaris-field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirmation error</p>
    </div>
</div>
