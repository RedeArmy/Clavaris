<!--
  Shared "choose a new password" card — used identically by both the tenant-tier
  (identity/reset-password.html) and platform-tier (identity/platform/reset-password.html) pages.
  Both controllers bind the exact same ConfirmPasswordResetForm type (see
  ResetPlatformAccountPasswordController's own Javadoc: "reuses ConfirmPasswordResetForm as-is, no
  tenant-specific field on it"), so the same th:field selection expressions resolve unchanged
  against either page's own th:object scope. Found 100% duplicated verbatim between both pages
  (SonarCloud), not a false positive — same rationale
  identity/fragments/forgot-password-form.html's own header comment documents.
-->
<div class="clavaris-card" th:fragment="card">
    <h1>Choose a new password</h1>

    <form th:action="@{''}" th:object="${form}" method="post">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{token}"/>

        <div th:replace="~{identity/fragments/new-password-fields :: fields}"></div>

        <button class="clavaris-button" type="submit">Reset password</button>
    </form>
</div>
