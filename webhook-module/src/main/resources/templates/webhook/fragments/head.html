<!--
  Local copy of identity-module's own identity/fragments/head.html (five lines: charset, viewport,
  title, clavaris.css link, ADR-0009 §3 brand-color hook) — same deliberate-duplication rationale
  organization-module's/client-registry-module's own local copies document: no module here declares
  a Maven dependency on another bounded-context module, in main or test scope, which is exactly what
  a shared cross-module Thymeleaf fragment would otherwise require. A cross-module th:replace works
  in the app module's aggregated runtime classpath but breaks this module's own standalone-MockMvc
  controller tests, the established pattern in this codebase.

  Keep in sync with identity-module's, organization-module's, and client-registry-module's own
  copies by hand if any changes — five lines, low churn, an explicit trade favoring per-module test
  self-containment over DRY.
-->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle}">Clavaris</title>
    <link rel="stylesheet" th:href="@{/css/clavaris.css}"/>
    <style th:if="${branding != null and branding.primaryColor != null and branding.primaryColor.isPresent()}"
           th:text="':root { --clavaris-brand-color: ' + ${branding.primaryColor.get()} + '; }'">/* th:text overwrites this at render time — see ADR-0009 §3 */</style>
</head>
