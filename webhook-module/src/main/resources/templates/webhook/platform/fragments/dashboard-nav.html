<!--
  Local copy of organization-module's own organization/platform/fragments/dashboard-nav.html — same
  deliberate-duplication rationale as identity-module's/client-registry-module's own local copies
  document: no module here declares a Maven dependency on another, so a single shared sidebar
  fragment would only be reachable from the app module's aggregated runtime classpath, not from
  either module's own standalone-MockMvc controller tests.

  Keep in sync with organization-module's, identity-module's, and client-registry-module's own
  copies by hand if a nav item is added, removed, or reordered.
-->
<aside th:fragment="sidebar(active)" class="clavaris-sidebar">
    <a class="clavaris-skip-link" href="#main-content">Skip to content</a>
    <a class="clavaris-sidebar__brand" th:href="@{/platform/dashboard}" aria-label="Clavaris dashboard">
        <img th:src="${#resourceUrl != null ? #resourceUrl.url('/brand/clavaris-mark-polished.svg') : '/brand/clavaris-mark-polished.svg'}" alt="" width="32" height="32"/>
        <span>Clavaris <small>Control plane</small></span>
    </a>
    <nav class="clavaris-sidebar__nav">
        <a th:href="@{/platform/dashboard}" th:classappend="${active == 'organizations'} ? 'active'" th:attr="aria-current=${active == 'organizations'} ? 'page'"><span class="clavaris-nav-icon"><svg class="clavaris-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span> Organizations</a>
        <a th:href="@{/platform/account/sessions}" th:classappend="${active == 'sessions'} ? 'active'" th:attr="aria-current=${active == 'sessions'} ? 'page'"><span class="clavaris-nav-icon"><svg class="clavaris-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span> Sessions</a>
    </nav>
    <details class="clavaris-profile">
        <summary class="clavaris-account-menu" aria-label="Open account menu">
            <span class="clavaris-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.25" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 20c.65-3.35 3.05-5 6.5-5s5.85 1.65 6.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="clavaris-account-menu__label">Account</span><span class="clavaris-profile__chevron" aria-hidden="true"><svg class="clavaris-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
        </summary>
        <div class="clavaris-profile__panel">
            <div class="clavaris-profile__identity"><span class="clavaris-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.25" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 20c.65-3.35 3.05-5 6.5-5s5.85 1.65 6.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span><strong>Platform account</strong><small>Identity control plane</small></span></div>
            <div class="clavaris-profile__actions"><button type="button" class="clavaris-button clavaris-button--secondary clavaris-button--inline" data-dialog-open="manage-account-dialog" th:attr="hx-get=@{/platform/account}" hx-target="#manage-account-dialog-body" hx-trigger="click once" hx-swap="innerHTML">Manage account</button><form th:action="@{/platform/logout}" method="post"><input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit" class="clavaris-button clavaris-button--secondary clavaris-button--inline">Sign out</button></form></div>
        </div>
    </details>
    <!-- ADR-0026: empty shell — real content is HTMX-loaded on first open (see the trigger button's
         own hx-get above) from PlatformAccountProfileController's own dual-mode GET /platform/account. -->
    <dialog id="manage-account-dialog" class="clavaris-dialog clavaris-dialog--wide">
        <div class="clavaris-dialog__header">
            <div><h2>Account</h2></div>
            <button class="clavaris-dialog__close" type="button" data-dialog-close aria-label="Close manage account dialog"><svg class="clavaris-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div id="manage-account-dialog-body">Loading&hellip;</div>
    </dialog>
    <!-- Live bug, 2026-09-22: this sidebar's own "Manage account" trigger needs both
         scripts below unconditionally (htmx for its own hx-get, organization-dialog.js for
         data-dialog-open/-close on its own dialog) — previously each page decided whether to
         load them based only on its own content's needs, blind to this shared fragment's own
         requirements. Result: on every page whose own author had no other reason to load
         either script, "Manage account" silently failed — the dialog either opened (native
         <dialog> markup, JS-independent) and stuck on "Loading..." forever (htmx missing), or
         never opened at all (organization-dialog.js missing too). Loading both here, once,
         guarantees every page that includes this fragment gets them — the now-redundant
         standalone tags these replace have been removed from every page that had them. -->
    <script th:src="${#resourceUrl != null ? #resourceUrl.url('/js/htmx.min.js') : '/js/htmx.min.js'}" defer></script>
    <script th:src="${#resourceUrl != null ? #resourceUrl.url('/js/organization-dialog.js') : '/js/organization-dialog.js'}" defer></script>
    <!-- Shared click-through confirmation for any <form data-confirm="...">, see confirm-action.js. -->
    <script th:src="${#resourceUrl != null ? #resourceUrl.url('/js/confirm-action.js') : '/js/confirm-action.js'}" defer></script>
    <!-- Real bug found live, 2026-09-26: event-type-picker.html's own parent/child category
         checkboxes and "All Events" toggle did nothing in a real browser — CSP silently blocked
         the inline onchange="..."/<script> this fragment used to carry (see event-type-picker.js's
         own Javadoc-style comment for the full story). Loaded unconditionally here, same "every
         page that includes this sidebar gets it" reasoning as htmx/organization-dialog.js above —
         a no-op on any page without #event-type-options in the DOM.
         category-checkbox-picker.js must load first — event-type-picker.js calls into it directly. -->
    <script th:src="${#resourceUrl != null ? #resourceUrl.url('/js/category-checkbox-picker.js') : '/js/category-checkbox-picker.js'}" defer></script>
    <script th:src="${#resourceUrl != null ? #resourceUrl.url('/js/event-type-picker.js') : '/js/event-type-picker.js'}" defer></script>
</aside>
