<!--
Live UX request, 2026-09-25 (Clerk/PayPal-parity Event Catalog): the checkbox vocabulary shared by
the "Register a new webhook endpoint" page and the endpoint detail page's own "Event types" edit
dialog — one fragment, so the search/category/wildcard behavior never drifts between the two. Each
option row carries a data-label (value + description, lowercased) the search box filters against
client-side; a category row hides itself once every row under it is filtered out. The "All Events"
wildcard is PayPal's own pattern (see the checkbox itself for why WebhookEndpoint.
ALL_EVENTS_WILDCARD is submitted through a separate, normally-disabled hidden input rather than one
of the real per-event checkboxes) — WebhookEndpoint#subscribesTo treats that one sentinel value as
"every event type, including one this codebase doesn't produce yet".

Live UX request, 2026-09-25 (polish pass): each category is now its own checkbox, not just a plain
label — checking it selects every event underneath it in one click (window.toggleEventCategory),
and it reflects back to checked/indeterminate/unchecked as the individual events under it change
(window.updateEventCategoryCheckboxState) — the standard "select all in this group" parent/child
checkbox pattern. Child rows are visually indented under their own category (.clavaris-event-option
below) so the hierarchy reads the same way it behaves.
-->
<div th:fragment="picker(fieldName, selectedValues)">
    <div class="clavaris-field">
        <label for="event-search">Search events</label>
        <input type="text" id="event-search" placeholder="Search events…" autocomplete="off"
               oninput="window.filterWebhookEventOptions(this.value)"/>
    </div>

    <div class="clavaris-field">
        <label class="clavaris-toggle">
            <input type="checkbox" id="all-events-checkbox"
                   th:checked="${#lists.contains(selectedValues, '*')}"
                   onchange="window.toggleAllEventsWildcard(this.checked)"/>
            <span class="clavaris-toggle__track"><span class="clavaris-toggle__thumb"></span></span>
            <span class="clavaris-toggle__label">All Events — including event types this system adds in the future</span>
        </label>
        <!-- Never a real per-event checkbox's own value: keeping the wildcard out of the
             individually-checkable list means an owner can never half-select it (e.g. by having
             both "*" and "account.created" checked at once, which WebhookEndpoint#subscribesTo
             would silently treat as just "*" anyway) — the toggle above and this hidden input are
             the only place "*" can come from, and they're always in sync (see the script below). -->
        <input type="hidden" id="all-events-hidden-value" th:name="${fieldName}" value="*"
               th:disabled="${!#lists.contains(selectedValues, '*')}"/>
    </div>

    <div id="event-type-options" class="clavaris-uri-fieldset clavaris-event-picker" style="max-height: 320px; overflow-y: auto;">
        <div th:each="option, iterStat : ${T(com.clavaris.webhook.infrastructure.adapter.in.web.KnownWebhookEventTypeOptions).CATALOG}">
            <div class="clavaris-event-category-row"
                 th:if="${iterStat.index == 0 or !option.category().equals(T(com.clavaris.webhook.infrastructure.adapter.in.web.KnownWebhookEventTypeOptions).CATALOG[iterStat.index - 1].category())}"
                 th:attr="data-category=${option.category()}">
                <label>
                    <input type="checkbox" class="clavaris-event-category-checkbox"
                           th:attr="data-category=${option.category()}"
                           onchange="window.toggleEventCategory(this)"/>
                    <span th:text="${option.category()}">category</span>
                </label>
            </div>
            <div class="clavaris-event-option"
                 th:attr="data-label=${#strings.toLowerCase(option.value() + ' ' + option.description())},data-category=${option.category()}">
                <label th:title="${option.description()}">
                    <input type="checkbox" th:name="${fieldName}" th:value="${option.value()}"
                           th:checked="${#lists.contains(selectedValues, option.value())}"
                           th:disabled="${#lists.contains(selectedValues, '*')}"
                           th:attr="data-category=${option.category()}"
                           onchange="window.updateEventCategoryCheckboxState(this)"/>
                    <span th:text="${option.value()}">event type</span>
                </label>
            </div>
        </div>
    </div>
    <p id="event-search-empty" class="clavaris-empty-state" style="display: none;">No events match your search.</p>

    <script>
        // Live UX request, 2026-09-25: shared by every page that includes this fragment — defined
        // once as window-level functions (not an IIFE-scoped closure) since both the register page
        // and the edit-event-types dialog only ever include this fragment once each, and the
        // onchange/oninput attributes above call these by name.
        window.toggleAllEventsWildcard = function (checked) {
            document.getElementById('all-events-hidden-value').disabled = !checked;
            document.querySelectorAll('#event-type-options input[type=checkbox]').forEach(function (checkbox) {
                checkbox.disabled = checked;
                checkbox.indeterminate = false;
                if (checked) {
                    checkbox.checked = false;
                }
            });
        };

        // Parent → children: checking/unchecking a category checkbox applies to every event
        // checkbox filed under that same category, regardless of the search box's current filter
        // (a category the owner already expanded stays fully controllable even while filtered).
        window.toggleEventCategory = function (categoryCheckbox) {
            var category = categoryCheckbox.dataset.category;
            var checked = categoryCheckbox.checked;
            categoryCheckbox.indeterminate = false;
            document
                .querySelectorAll('#event-type-options .clavaris-event-option input[data-category="' + category + '"]')
                .forEach(function (checkbox) {
                    if (!checkbox.disabled) {
                        checkbox.checked = checked;
                    }
                });
        };

        // Children → parent: every individual checkbox change re-derives its own category
        // checkbox's state — checked only once every child is checked, indeterminate for a
        // partial selection, unchecked once none are.
        window.updateEventCategoryCheckboxState = function (changedCheckbox) {
            var category = changedCheckbox.dataset.category;
            var categoryCheckbox = document.querySelector(
                '#event-type-options .clavaris-event-category-checkbox[data-category="' + category + '"]');
            if (!categoryCheckbox) {
                return;
            }
            var children = document.querySelectorAll(
                '#event-type-options .clavaris-event-option input[data-category="' + category + '"]');
            var checkedCount = 0;
            children.forEach(function (checkbox) {
                if (checkbox.checked) {
                    checkedCount++;
                }
            });
            categoryCheckbox.checked = checkedCount === children.length;
            categoryCheckbox.indeterminate = checkedCount > 0 && checkedCount < children.length;
        };

        window.filterWebhookEventOptions = function (query) {
            var normalized = query.trim().toLowerCase();
            var anyVisible = false;
            var visibleCategories = {};
            document.querySelectorAll('#event-type-options .clavaris-event-option').forEach(function (row) {
                var matches = normalized === '' || row.dataset.label.includes(normalized);
                row.style.display = matches ? '' : 'none';
                if (matches) {
                    anyVisible = true;
                    visibleCategories[row.dataset.category] = true;
                }
            });
            document.querySelectorAll('#event-type-options .clavaris-event-category-row').forEach(function (row) {
                row.style.display = visibleCategories[row.dataset.category] ? '' : 'none';
            });
            document.getElementById('event-search-empty').style.display = anyVisible ? 'none' : '';
        };

        // Initial load: derive every category checkbox's own starting state from whichever event
        // checkboxes already came pre-checked (editing an existing endpoint), and — same as a live
        // toggle — an endpoint already subscribed to "*" renders with every individual and category
        // checkbox already disabled.
        document.querySelectorAll('#event-type-options .clavaris-event-category-checkbox').forEach(function (categoryCheckbox) {
            var firstChild = document.querySelector(
                '#event-type-options .clavaris-event-option input[data-category="' + categoryCheckbox.dataset.category + '"]');
            if (firstChild) {
                window.updateEventCategoryCheckboxState(firstChild);
            }
        });
        if (document.getElementById('all-events-checkbox').checked) {
            window.toggleAllEventsWildcard(true);
        }
    </script>
</div>
