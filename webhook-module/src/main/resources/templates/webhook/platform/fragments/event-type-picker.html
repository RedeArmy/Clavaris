<!--
Live UX request, 2026-09-25 (Clerk/PayPal-parity Event Catalog): the checkbox vocabulary shared by
the "Register a new webhook endpoint" page and the endpoint detail page's own "Event types" edit
dialog — one fragment, so the category/wildcard behavior never drifts between the two. The "All
Events" wildcard is PayPal's own pattern (see the checkbox itself for why WebhookEndpoint.
ALL_EVENTS_WILDCARD is submitted through a separate, normally-disabled hidden input rather than one
of the real per-event checkboxes) — WebhookEndpoint#subscribesTo treats that one sentinel value as
"every event type, including one this codebase doesn't produce yet".

Live UX request, 2026-09-25 (polish pass): each category is its own checkbox, not just a plain
label — checking it selects every event underneath it in one click, and it reflects back to
checked/indeterminate/unchecked as the individual events under it change — the standard "select all
in this group" parent/child checkbox pattern. Child rows are visually indented under their own
category (.clavaris-event-option below) so the hierarchy reads the same way it behaves.

Live UX request, 2026-09-25 (second polish pass): the search box from the first pass is gone — with
~14 event types total, a search adds nothing over just scanning the (now collapsible-by-category,
see webhook-event-catalog.html's own <details> for the read-only reference page) list, and revisit
only once the catalog genuinely grows past a quick scan.

Real bug found live, 2026-09-26: the parent/child checkboxes and "All Events" toggle looked correct
in every MockMvc content-assertion test (which renders markup but never executes JS or enforces
CSP) yet did nothing in a real browser — this fragment used to wire everything via inline
onchange="..." attributes plus an inline <script> block, both silently blocked by
ContentSecurityPolicyHeaderWriter's own DASHBOARD_PAGE_POLICY (script-src 'self', deliberately
never 'unsafe-inline' — ADR-0025). All of that behavior now lives in the same-origin
/js/event-type-picker.js (loaded once, unconditionally, by this module's own dashboard-nav.html —
same convention organization-dialog.js/htmx.min.js already establish), wired via event delegation
on document, matching organization-dialog.js's own shape exactly. This fragment itself carries no
script and no inline event-handler attributes at all now — only the id/class/data-* hooks that
external script reads.
-->
<div th:fragment="picker(fieldName, selectedValues)">
    <div class="clavaris-field">
        <label class="clavaris-toggle">
            <input type="checkbox" id="all-events-checkbox"
                   th:checked="${#lists.contains(selectedValues, '*')}"/>
            <span class="clavaris-toggle__track"><span class="clavaris-toggle__thumb"></span></span>
            <span class="clavaris-toggle__label">All Events — including event types this system adds in the future</span>
        </label>
        <!-- Never a real per-event checkbox's own value: keeping the wildcard out of the
             individually-checkable list means an owner can never half-select it (e.g. by having
             both "*" and "account.created" checked at once, which WebhookEndpoint#subscribesTo
             would silently treat as just "*" anyway) — the toggle above and this hidden input are
             the only place "*" can come from, and they're always in sync (see event-type-picker.js). -->
        <input type="hidden" id="all-events-hidden-value" th:name="${fieldName}" value="*"
               th:disabled="${!#lists.contains(selectedValues, '*')}"/>
    </div>

    <div id="event-type-options" class="clavaris-uri-fieldset clavaris-event-picker" style="max-height: 320px; overflow-y: auto;">
        <div th:each="option, iterStat : ${T(com.clavaris.webhook.infrastructure.adapter.in.web.KnownWebhookEventTypeOptions).CATALOG}">
            <div class="clavaris-event-category-row"
                 th:if="${iterStat.index == 0 or !option.category().equals(T(com.clavaris.webhook.infrastructure.adapter.in.web.KnownWebhookEventTypeOptions).CATALOG[iterStat.index - 1].category())}">
                <label>
                    <input type="checkbox" class="clavaris-event-category-checkbox"
                           th:attr="data-category=${option.category()}"/>
                    <span th:text="${option.category()}">category</span>
                </label>
            </div>
            <div class="clavaris-event-option">
                <label th:title="${option.description()}">
                    <input type="checkbox" th:name="${fieldName}" th:value="${option.value()}"
                           th:checked="${#lists.contains(selectedValues, option.value())}"
                           th:disabled="${#lists.contains(selectedValues, '*')}"
                           th:attr="data-category=${option.category()}"/>
                    <span th:text="${option.value()}">event type</span>
                </label>
            </div>
        </div>
    </div>
</div>
