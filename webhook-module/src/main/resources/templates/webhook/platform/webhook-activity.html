<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{webhook/fragments/head :: head(${organizationName} + ' — Activity — Clavaris')}">
    <title>Activity — Clavaris</title>
</head>
<body>
<div class="clavaris-dashboard">
    <aside th:replace="~{webhook/platform/fragments/dashboard-nav :: sidebar('organizations')}"></aside>
    <main id="main-content" class="clavaris-dashboard__content">
        <div class="clavaris-dashboard__inner">
            <p class="clavaris-breadcrumb">
                <a th:href="@{/platform/dashboard}">Organizations</a> /
                <a th:href="@{/platform/dashboard/organizations/{id}(id=${organizationId})}" th:text="${organizationName}">Organization</a> /
                <span>Activity</span>
            </p>

            <div th:replace="~{webhook/platform/fragments/org-tabs :: tabs(${organizationId}, 'configure')}"></div>

            <div class="clavaris-configure-layout">
                <div th:replace="~{platform/fragments/configure-sidebar :: sidebar(${organizationId}, 'webhook-endpoints')}"></div>

                <div class="clavaris-configure-content">
                    <div th:replace="~{webhook/platform/fragments/webhook-subnav :: tabs(${organizationId}, 'activity')}"></div>

                    <div class="clavaris-page-header">
                        <div>
                            <h1>Activity</h1>
                            <p>Delivery attempts across every one of this Organization's own
                                webhook endpoints, last 6 hours.</p>
                        </div>
                    </div>

                    <div class="clavaris-section-card">
                        <div class="clavaris-stat-row">
                            <div>
                                <p class="clavaris-stat__label">Successful Attempts</p>
                                <p class="clavaris-stat__value clavaris-stat__value--success" th:text="${activity.successfulAttempts()}">0</p>
                            </div>
                            <div>
                                <p class="clavaris-stat__label">Failed Attempts</p>
                                <p class="clavaris-stat__value clavaris-stat__value--danger" th:text="${activity.failedAttempts()}">0</p>
                            </div>
                        </div>
                    </div>

                    <!-- Hand-drawn SVG bar chart, deliberately not a JS charting library (this codebase has
                         none) and not CSS heights: the dashboard's CSP is style-src 'self', which blocks
                         every inline style attribute, so a bar height computed per request can only travel
                         as an SVG attribute. Six hourly slots, each stacking its success (green) bar
                         under its failure (red) bar; heights are each bucket's share of maxBucketTotal
                         (the controller's own computation — see that class's own Javadoc for why the max
                         lives there, not here). Decimals go through #numbers.formatDecimal with an
                         explicit POINT separator so a comma-decimal locale can't corrupt the attributes. -->
                    <div class="clavaris-section-card">
                        <h2>Recent Activity</h2>
                        <div th:if="${maxBucketTotal == 0}" class="clavaris-empty-state">
                            No delivery attempts in the last 6 hours.
                        </div>
                        <div th:unless="${maxBucketTotal == 0}">
                            <svg class="clavaris-bar-chart" viewBox="0 0 600 190" role="img"
                                 aria-label="Webhook delivery attempts per hour over the last 6 hours, successes and failures">
                                <line class="clavaris-bar-chart__axis" x1="0" y1="150" x2="600" y2="150"/>
                                <g th:each="bucket, stat : ${activity.hourlyBuckets()}"
                                   th:with="successHeight=${bucket.successCount() * 150.0 / maxBucketTotal},
                                            failureHeight=${bucket.failureCount() * 150.0 / maxBucketTotal},
                                            barX=${stat.index * 100 + 22}">
                                    <title th:text="${#temporals.format(bucket.hourStart(), 'HH:mm')} + ' — ' + ${bucket.successCount()} + ' succeeded, ' + ${bucket.failureCount()} + ' failed'">HH:mm</title>
                                    <rect class="clavaris-bar-chart__bar--success" width="56" rx="3"
                                          th:if="${bucket.successCount() > 0}"
                                          th:attr="x=${barX},y=${#numbers.formatDecimal(150 - successHeight, 1, 2, 'POINT')},height=${#numbers.formatDecimal(successHeight, 1, 2, 'POINT')}"/>
                                    <rect class="clavaris-bar-chart__bar--failure" width="56" rx="3"
                                          th:if="${bucket.failureCount() > 0}"
                                          th:attr="x=${barX},y=${#numbers.formatDecimal(150 - successHeight - failureHeight, 1, 2, 'POINT')},height=${#numbers.formatDecimal(failureHeight, 1, 2, 'POINT')}"/>
                                    <text class="clavaris-bar-chart__label" y="174"
                                          th:attr="x=${barX + 28}"
                                          th:text="${#temporals.format(bucket.hourStart(), 'HH:mm')}">HH:mm</text>
                                </g>
                            </svg>
                            <ul class="clavaris-chart-legend">
                                <li class="clavaris-chart-legend__success">Succeeded</li>
                                <li class="clavaris-chart-legend__failure">Failed</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
