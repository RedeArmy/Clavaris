# TD-FUT-011 / ADR-0015: scrapes the app's own /actuator/prometheus (management.endpoints.web.
# exposure.include, application.yml) — every counter/gauge/histogram SecurityMetricsRecorder,
# WebMvcMetricsFilter (real HTTP-per-endpoint latency percentiles), HikariCP, and the JVM itself
# expose, all in one place.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: clavaris-app
    metrics_path: /actuator/prometheus
    static_configs:
      # "app" — the Docker Compose service name, reachable by DNS on the shared network this file's
      # own docker-compose.observability.yml joins docker-compose.yml's default network through.
      - targets: ["app:8080"]

  # TD-PROC-017: memory use against the ceiling, rejected writes and whether Redis answers at all.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          redis: sessions
      # TD-SEC-095: the abuse counters' own instance, which exists in the production compose; this
      # target stays down (and silent) in the development stack, which runs one Redis.
      - targets: ["redis-counters-exporter:9121"]
        labels:
          redis: counters
