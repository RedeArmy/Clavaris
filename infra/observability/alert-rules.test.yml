# TD-PROC-013: unit tests for the saturation, lag and burn-rate alerts. Run with
#   docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v2.55.1 \
#     test rules alert-rules.test.yml
# (CI runs the same command.) Each case feeds synthetic series and asserts the alert fires, or does
# not, at the stated time, so a typo in a metric name or a threshold fails here, not in production.
rule_files:
  - alert-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: a pool queue that lasts two minutes alerts
    input_series:
      - series: 'hikaricp_connections_pending{pool="HikariPool-1"}'
        values: '0 0 3 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 3m
        alertname: DatabasePoolSaturated
        exp_alerts: []
      - eval_time: 6m
        alertname: DatabasePoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Requests are queueing for a database connection"
              description: "3 request(s) have been waiting for a pooled connection for 2 minutes. The pool is deliberately small; look for a slow query or a long transaction (organization deletion, the DNS reverification job) before raising it."

  - interval: 1m
    name: a one-minute pool blip does not alert
    input_series:
      - series: 'hikaricp_connections_pending{pool="HikariPool-1"}'
        values: '0 2 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 6m
        alertname: DatabasePoolSaturated
        exp_alerts: []

  - interval: 1m
    name: a connection timeout alerts immediately
    input_series:
      - series: 'hikaricp_connections_timeout_total{pool="HikariPool-1"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: DatabaseConnectionTimeouts
        exp_alerts:
          - exp_labels:
              severity: critical
              pool: HikariPool-1
            exp_annotations:
              summary: "Requests failed to get a database connection in time"
              description: "A request gave up waiting for a pooled connection (connection-timeout) in the last 5 minutes. Users saw errors, not just slowness."

  - interval: 1m
    name: argon2 rejections above one every ten seconds for three minutes alert
    input_series:
      - series: 'clavaris_auth_argon2_bulkhead_total{outcome="rejected"}'
        values: '0+12x10'
      - series: 'clavaris_auth_argon2_bulkhead_total{outcome="admitted"}'
        values: '0+600x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: Argon2BulkheadRejecting
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Password verifications are being refused for lack of CPU"
              description: "More than one sign-in every ten seconds is being rejected by the Argon2 admission gate. Either a burst of real traffic outgrew the host's cores or someone is spending them; compare with HighLoginFailureRate."

  - interval: 1m
    name: a lagging webhook engine and a stuck outbox alert, an idle one does not
    input_series:
      - series: 'clavaris_webhook_deliveries_oldest_due_age_seconds'
        values: '0 0 400 400 400 400 400 400'
      - series: 'clavaris_outbox_oldest_unpublished_age_seconds{source="identity"}'
        values: '0 0 0 0 0 0 0 0'
      - series: 'clavaris_outbox_oldest_unpublished_age_seconds{source="organization"}'
        values: '0 0 200 200 200 200 200 200'
    alert_rule_test:
      - eval_time: 7m
        alertname: WebhookDeliveriesFallingBehind
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Webhook deliveries are overdue by more than five minutes"
              description: "The oldest due delivery has waited 6m 40s. Check the delivery executor, the scheduler thread and the consuming endpoints' error rates."
      - eval_time: 7m
        alertname: OutboxNotBeingDispatched
        exp_alerts:
          - exp_labels:
              severity: warning
              source: organization
            exp_annotations:
              summary: "The organization event outbox is not being dispatched"
              description: "The oldest unpublished organization event has waited 3m 20s; the dispatcher is not draining it (see WebhookDispatchScheduler and its advisory lock)."

  - interval: 1m
    name: unreadable lag gauges are reported
    input_series:
      - series: 'clavaris_webhook_deliveries_due'
        values: 'NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 7m
        alertname: BacklogMetricsUnavailable
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: "The webhook and outbox lag gauges cannot read the database"
              description: "WebhookBacklogMetrics returns NaN when its queries fail, so the lag alerts are blind."

  - interval: 1m
    name: a 10 percent error ratio burns the budget fast, a ratio that already recovered does not
    input_series:
      - series: 'http_server_requests_seconds_count{status="200"}'
        values: '0+90x120'
      - series: 'http_server_requests_seconds_count{status="500"}'
        values: '0+10x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: AvailabilityErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Burning the 30-day error budget 14x too fast"
              description: "At this rate the month's 0.5% error budget is gone in about two days."

  - interval: 1m
    name: a short spike that already ended does not page
    input_series:
      - series: 'http_server_requests_seconds_count{status="200"}'
        values: '0+100x120'
      - series: 'http_server_requests_seconds_count{status="500"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: AvailabilityErrorBudgetFastBurn
        exp_alerts: []

  - interval: 1m
    name: a full old generation alerts, and the young pools' undefined max does not skew it
    input_series:
      - series: 'jvm_memory_used_bytes{area="heap",id="G1 Old Gen"}'
        values: '950+0x15'
      - series: 'jvm_memory_max_bytes{area="heap",id="G1 Old Gen"}'
        values: '1000+0x15'
      - series: 'jvm_memory_used_bytes{area="heap",id="G1 Eden Space"}'
        values: '10+0x15'
      - series: 'jvm_memory_max_bytes{area="heap",id="G1 Eden Space"}'
        values: '-1+0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: JvmHeapNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "JVM old generation above 90% for 10 minutes"
              description: "The heap is sized to survive the worst-case Argon2 working set (application.yml, TD-PERF-007); sustained use this high means a leak or a load that was not sized for."

  - interval: 1m
    name: an email request that is rejected alerts at once
    input_series:
      - series: 'clavaris_email_request_rejected_total'
        values: '0 0 0 4 4 4'
    alert_rule_test:
      - eval_time: 2m
        alertname: EmailRequestsDropped
        exp_alerts: []
      - eval_time: 4m
        alertname: EmailRequestsDropped
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Sign-in code, link or reset emails are being dropped"
              description: "4 email request(s) were rejected in five minutes because the pool was full. The person was told to check their email; no email was sent."

  - interval: 1m
    name: a pool queue that stays full for two minutes alerts, a brief spike does not
    input_series:
      - series: 'executor_queue_remaining_tasks{name="emailRequestExecutor"}'
        values: '1000 1000 0 0 0 0 1000'
      - series: 'executor_queue_remaining_tasks{name="webhookDeliveryExecutor"}'
        values: '1000 0 1000 1000 1000 1000 1000'
    alert_rule_test:
      - eval_time: 3m
        alertname: ExecutorQueueFull
        exp_alerts: []
      - eval_time: 5m
        alertname: ExecutorQueueFull
        exp_alerts:
          - exp_labels:
              severity: warning
              name: emailRequestExecutor
            exp_annotations:
              summary: "The emailRequestExecutor pool's queue has been full for two minutes"
              description: "Work submitted to emailRequestExecutor is being rejected. For the email pool that is mail nobody will receive; look at the mail provider's circuit breaker and the pool's active threads before raising the queue."

  - interval: 1m
    name: a recovery email that is rejected alerts at once
    input_series:
      - series: 'clavaris_email_recovery_rejected_total'
        values: '0 0 0 2 2 2'
    alert_rule_test:
      - eval_time: 2m
        alertname: RecoveryEmailsDropped
        exp_alerts: []
      - eval_time: 4m
        alertname: RecoveryEmailsDropped
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Password-reset, verification or lockout emails are being dropped"
              description: "2 recovery email request(s) were rejected in five minutes because the recovery pool was full. The person was told to check their email; no email was sent. Look at the mail provider's circuit breaker first."

  - interval: 1m
    name: redis near its ceiling for five minutes alerts, a brief spike does not
    input_series:
      - series: 'redis_memory_used_bytes'
        values: '100 900 900 900 900 900 900 100'
      - series: 'redis_memory_max_bytes'
        values: '1000 1000 1000 1000 1000 1000 1000 1000'
    alert_rule_test:
      - eval_time: 4m
        alertname: RedisMemoryNearCeiling
        exp_alerts: []
      - eval_time: 6m
        alertname: RedisMemoryNearCeiling
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Redis is above 80% of its memory ceiling"
              description: "90% of the ceiling is in use. At 100% Redis refuses writes (noeviction): new sign-ins and counters fail. Find what is filling it (redis-cli --bigkeys) before raising the ceiling; a flood of distinct identifiers on the sign-in code pages is the usual cause."

  - interval: 1m
    name: an unlimited redis never trips the ceiling alert
    input_series:
      - series: 'redis_memory_used_bytes'
        values: '900 900 900 900 900 900 900'
      - series: 'redis_memory_max_bytes'
        values: '0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 7m
        alertname: RedisMemoryNearCeiling
        exp_alerts: []

  - interval: 1m
    name: redis rejecting commands alerts at once and a silent redis alerts after a minute
    input_series:
      - series: 'redis_commands_rejected_calls_total{cmd="set"}'
        values: '0 0 0 5 5 5'
      - series: 'redis_up'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: RedisRejectingWrites
        exp_alerts: []
      - eval_time: 4m
        alertname: RedisRejectingWrites
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Redis is rejecting commands"
              description: "Redis refused 5 command(s) in five minutes, which with noeviction means it is at its memory ceiling. Sign-ins and rate-limit counters are failing."
      - eval_time: 5m
        alertname: RedisDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Redis is not answering"
              description: "Sessions, rate limiting and the one-time-code lockout all depend on it; the rate limiter fails open (RateLimitFailOpen) and nobody can sign in until it is back."

  # TD-ARCH-048: a failed run, a job that stopped succeeding, an integrity violation and a default
  # partition in use each alert; a healthy night does not.
  - interval: 1h
    name: a failing job alerts, a healthy one does not
    input_series:
      - series: 'clavaris_job_runs_total{scheduled_job="webhook_delivery_retention",outcome="failure"}'
        values: '0 0 1 1 1'
      - series: 'clavaris_job_runs_total{scheduled_job="event_outbox_retention",outcome="failure"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 3h
        alertname: ScheduledJobFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              scheduled_job: webhook_delivery_retention
              outcome: failure
            exp_annotations:
              summary: "Scheduled job webhook_delivery_retention failed"
              description: "webhook_delivery_retention ended in an error in the last day. Its own log line names the cause (event=... exceptionType=...); a retention or cleanup job that keeps failing lets its table grow without bound."

  # One sample a minute, as a scrape would give: with hourly samples the five-minute staleness of an
  # instant vector would hide the series between them and the test would prove nothing.
  - interval: 1m
    name: a job that stopped succeeding alerts after a day and a half, one that keeps succeeding does not
    input_series:
      # Stamped every minute with the time itself, as a job that runs constantly would.
      - series: 'clavaris_job_last_success_timestamp_seconds{scheduled_job="webhook_dispatch"}'
        values: '0+60x2400'
      # Succeeded once at hour 2 (7200 s) and never again.
      - series: 'clavaris_job_last_success_timestamp_seconds{scheduled_job="expired_identity_records"}'
        values: '7200x2400'
      # Only ever failed: the gauge reads 0.
      - series: 'clavaris_job_last_success_timestamp_seconds{scheduled_job="oauth2_authorization_retention"}'
        values: '0x2400'
    alert_rule_test:
      - eval_time: 30h
        alertname: ScheduledJobNotSucceeding
        exp_alerts: []
      - eval_time: 40h
        alertname: ScheduledJobNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: warning
              scheduled_job: expired_identity_records
            exp_annotations:
              summary: "Scheduled job expired_identity_records has not succeeded for a day and a half"
              description: "expired_identity_records last completed 1d 14h 0m 0s ago, or has never completed since the process started. The nightly jobs run once a day, so 36 hours means one missed night."
          - exp_labels:
              severity: warning
              scheduled_job: oauth2_authorization_retention
            exp_annotations:
              summary: "Scheduled job oauth2_authorization_retention has not succeeded for a day and a half"
              description: "oauth2_authorization_retention last completed 1d 16h 0m 0s ago, or has never completed since the process started. The nightly jobs run once a day, so 36 hours means one missed night."

  - interval: 1m
    name: an account with no sign-in method and a default partition in use alert, the unknown and the clean do not
    input_series:
      - series: 'clavaris_integrity_accounts_without_authentication_method'
        values: '-1 -1 2 2 2 2 2 2'
      - series: 'clavaris_audit_events_default_partition_in_use'
        values: '0 0 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: AccountAuthMethodIntegrityViolation
        exp_alerts: []
      - eval_time: 7m
        alertname: AccountAuthMethodIntegrityViolation
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Accounts exist with no way to sign in"
              description: "2 Account(s) have neither a password credential nor a linked identity (BR-ID-02). Find them with a direct query; the job logs only the count, never who."
      - eval_time: 7m
        alertname: AuditEventsDefaultPartitionInUse
        exp_alerts: []

  # TD-SEC-095: the counters' own Redis reports when it evicts and when its key count surges; the
  # sessions' instance (a different redis label) does not trip either.
