# TD-PROC-037: distributionSha256Sum is deliberately NOT set. mvnw downloads the .tar.gz on Linux and
# macOS and the .zip on Windows and checks the one checksum against whichever it fetched, so a single
# value would break mvnw on the other platform. The image build and the CI jobs that need Maven fetch
# the .tar.gz themselves with scripts/fetch-maven.sh (retried, from three hosts) and check it against
# distributionTarGzSha256Sum below, which mvnw ignores. When distributionUrl changes, that value must
# change with it or the fetch stops with a checksum error:
#   curl -fsSL <distributionUrl with .zip replaced by .tar.gz> | sha256sum
# Apache publishes the SHA-512 next to each archive at
# https://archive.apache.org/dist/maven/maven-3/<version>/binaries/ to cross-check it.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.1/apache-maven-3.10.1-bin.zip
distributionTarGzSha256Sum=810b8348f0a40f9116c202093fae007ebeabf67699bf34d81ee7e272289e085a
