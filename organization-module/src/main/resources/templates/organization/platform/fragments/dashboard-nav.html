<!--
  Sidebar for every /platform/dashboard/** page owned by this module's own templates (ADR-0025).
  One real destination today (Organizations, the dashboard's own root) — more items land here as
  their own sections ship (Workspaces, Secret Keys, OAuth Clients, Signing Keys, Webhook Endpoints,
  ... all reachable from an Organization's own detail page for now, not promoted to top-level nav
  until each has its own cross-Organization view worth linking directly).

  identity-module, client-registry-module, and webhook-module each keep their own copy of this
  exact fragment (identity/platform/fragments/dashboard-nav.html,
  clientregistry/platform/fragments/dashboard-nav.html,
  webhook/platform/fragments/dashboard-nav.html) for their own dashboard pages — see any copy's own
  comment for why it's a deliberate duplicate, not a cross-module th:replace. Keep all four in sync
  by hand.

  th:fragment parameter "active": which top-level section to highlight — a plain string compared
  against by each link below, not an enum (Thymeleaf has no clean way to pass one across a
  fragment boundary, and there are only ever a handful of top-level sections).
-->
<aside th:fragment="sidebar(active)" class="clavaris-sidebar">
    <a class="clavaris-sidebar__brand" th:href="@{/platform/dashboard}">Clavaris</a>
    <nav class="clavaris-sidebar__nav">
        <a th:href="@{/platform/dashboard}" th:classappend="${active == 'organizations'} ? 'active'">Organizations</a>
        <a th:href="@{/platform/account/sessions}" th:classappend="${active == 'sessions'} ? 'active'">Your sessions</a>
    </nav>
</aside>
