<!--
SonarCloud duplication fix, 2026-10-02: create-workspace-role.html and workspace-role-detail.html
had hand-duplicated this exact back-link + breadcrumb block (only the final breadcrumb segment
differs: a literal "New Role" vs. the role's own name). Same "one shared fragment is fine, both
callers live in this module" rationale workspace-page-header.html's own identical situation already
documents.
-->
<div th:fragment="header(organization, backTarget, backLabel, currentLabel)">
    <div th:replace="~{platform/fragments/back-link :: back(${backTarget}, ${backLabel})}"></div>
    <p class="clavaris-breadcrumb">
        <th:block th:replace="~{platform/fragments/breadcrumb :: organizations}"></th:block>
        <th:block th:replace="~{platform/fragments/breadcrumb :: organization(${organization.id()}, ${organization.name()})}"></th:block>
        <a th:href="@{/platform/dashboard/organizations/{organizationId}/workspace-roles(organizationId=${organization.id()})}">Workspace Roles</a> <span class="clavaris-breadcrumb__sep" aria-hidden="true">/</span>
        <span th:text="${currentLabel}">Current</span>
    </p>
</div>
