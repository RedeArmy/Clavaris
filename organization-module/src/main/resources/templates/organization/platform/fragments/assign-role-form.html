<!-- ADR-0029, redesigned 2026-09-27 ("Way 2" of a live UX request) — loaded by identity-module's
     organization-users.html into its own shared #assign-role-dialog-body via hx-get/hx-post. This
     file never renders on its own, only as a fragment target. No <!DOCTYPE html>/<html>/<body>
     wrapper — same fragment-file convention every sibling under */fragments/ already follows.

     Three tiers, each collapsing to a fixed hidden value instead of a <select> whenever there's
     nothing genuinely to choose from (PlatformAccountWorkspaceRoleController's own Javadoc has the
     full "why" for each):
       - Workspace: only shown (and only when the account has no membership yet) when the
         Organization has 2+ Workspaces; changing it reloads this whole fragment via its own
         hx-get, since Team/Role depend on which Workspace is active.
       - Team: "— No team (ungrouped) —" plus every real team that has at least one role in it
         (a team with zero roles doesn't count, doesn't show); only shown when there are 2+ such
         buckets to choose from. assign-role-picker.js filters the Role <select>'s own <option>s by
         the chosen team's data-team-id, client-side — same "grouped picker, no second round trip"
         convention scope-picker.js already establishes — and re-applies itself after every htmx
         swap (workspace change, validation-error redisplay), not just on first load.
       - Role: always a real <select> when hasAnyRoles is true — every role from every qualifying
         bucket, never filtered server-side (the Team select is a pure client-side lens over the
         same full list). -->
<div th:fragment="assignRoleForm">
    <div th:if="${noWorkspacesYet}">
        <p class="clavaris-empty-state">This Organization has no Workspaces yet.</p>
    </div>
    <div th:if="${!noWorkspacesYet and !hasAnyRoles}">
        <p class="clavaris-empty-state">This Workspace has no roles yet.</p>
    </div>

    <form th:if="${!noWorkspacesYet and hasAnyRoles}" method="post"
          th:action="@{/platform/dashboard/organizations/{organizationId}/accounts/{accountId}/assign-role(organizationId=${organizationId},accountId=${accountId})}"
          th:attr="hx-post=@{/platform/dashboard/organizations/{organizationId}/accounts/{accountId}/assign-role(organizationId=${organizationId},accountId=${accountId})}"
          hx-target="#assign-role-dialog-body" hx-swap="innerHTML">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <p class="clavaris-field-error" th:if="${cannotDemoteLastAdminError}">
            This would leave the Workspace with no one able to manage its own members — assign a
            different substitute first.
        </p>

        <input type="hidden" th:if="${membership != null}" name="workspaceId" th:value="${membership.workspaceId()}"/>
        <input type="hidden" th:if="${membership == null and !showWorkspaceSelector}" name="workspaceId" th:value="${activeWorkspaceId}"/>
        <div class="clavaris-field" th:if="${membership == null and showWorkspaceSelector}">
            <label for="assignRoleWorkspaceId">Workspace</label>
            <select id="assignRoleWorkspaceId" name="workspaceId"
                    th:attr="hx-get=@{/platform/dashboard/organizations/{organizationId}/accounts/{accountId}/assign-role(organizationId=${organizationId},accountId=${accountId})}"
                    hx-trigger="change" hx-include="this"
                    hx-target="#assign-role-dialog-body" hx-swap="innerHTML">
                <option th:each="workspaceOption : ${workspaces}" th:value="${workspaceOption.id()}"
                        th:text="${workspaceOption.name()}"
                        th:selected="${workspaceOption.id() == activeWorkspaceId}">Workspace</option>
            </select>
        </div>

        <div class="clavaris-field" th:if="${showTeamSelector}">
            <label for="assignRoleTeamId">Team</label>
            <select id="assignRoleTeamId" name="teamId">
                <option value="ungrouped"
                        th:selected="${currentRoleId == null or roleTeamId.get(currentRoleId) == null}">
                    Without Team
                </option>
                <option th:each="team : ${teams}" th:value="${team.id()}" th:text="${team.name()}"
                        th:selected="${currentRoleId != null and team.id() == roleTeamId.get(currentRoleId)}">
                    Team
                </option>
            </select>
        </div>

        <div class="clavaris-field">
            <label for="assignRoleNewRoleId">Role</label>
            <select id="assignRoleNewRoleId" name="newRoleId" required>
                <option th:each="role : ${allRoles}" th:value="${role.id()}" th:text="${role.name()}"
                        th:attr="data-team-id=${roleTeamId.get(role.id()) ?: 'ungrouped'}"
                        th:selected="${currentRoleId != null and currentRoleId == role.id()}">
                    Role
                </option>
            </select>
        </div>

        <div class="clavaris-dialog__actions">
            <button type="button" class="clavaris-button clavaris-button--secondary clavaris-button--inline" data-dialog-close>Cancel</button>
            <button type="submit" class="clavaris-button clavaris-button--inline">Save</button>
        </div>
    </form>
</div>
<div th:fragment="assignRoleSaved">
    <p class="clavaris-empty-state">Role updated.</p>
</div>
