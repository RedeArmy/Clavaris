<!--
SonarCloud duplication fix, 2026-10-02: create-workspace-role.html and workspace-role-detail.html
both had this exact Name field. *{name}/#fields.hasErrors('name') resolve against whichever
th:object (createForm/editForm respectively) is active on the enclosing <form> — this fragment
needs no parameter of its own, it just has to render inside that <form>, same as the markup it
replaces did.
-->
<div th:fragment="nameField" class="clavaris-field">
    <label for="role-name">Name</label>
    <input id="role-name" type="text" th:field="*{name}" required/>
    <p class="clavaris-field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>
</div>
