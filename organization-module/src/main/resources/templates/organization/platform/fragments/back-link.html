<!--
SDE-III review, 2026-09-27 — hand-duplicated from identity-module's own identical fragment
(identity/platform/fragments/back-link.html), same convention org-tabs.html's own comment in this
module already documents: no module here declares a Maven dependency on another, so a single
shared fragment would only be reachable from the app module's aggregated runtime classpath, not
from any one module's own standalone-MockMvc controller tests. Used by workspace-detail.html, one
level below Organization detail's own four top-level tabs.
-->
<a th:fragment="back(href, label)" class="clavaris-back-link" th:href="${href}">
    <span aria-hidden="true">&larr;</span> <span th:text="${label}">Back</span>
</a>
