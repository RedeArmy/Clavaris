<!--
SonarQube-style branch self-review fix, 2026-09-29: the "one member, one Remove button" row used to
be hand-duplicated between the team-grouped and "Without Team" role lists on
workspace-teams-hierarchy.html — identical markup, only the enclosing th:each's own role differed.
Extracted here, same "a block shared within one module gets its own fragments/*.html file"
precedent every other fragment in this directory already establishes (team-assign-role-form.html,
workspace-page-header.html, ...).

Real bug found and fixed in the same pass: the caller side originally combined th:each and
th:replace on the SAME <li> element (th:each="accountId : ..." th:replace="~{... :: row(...,
${accountId}, ...)}"). th:insert/th:replace has higher Thymeleaf attribute precedence than
th:each — on one tag, the fragment substitution is resolved before th:each's own iteration variable
is bound for that pass, so ${accountId} in the argument list evaluated against a scope where it
didn't exist yet. Every row silently rendered with a blank accountId (bare "members//unassign-role"
URLs, no label) — a real production bug, caught only by PlatformWorkspaceControllerTest's own
content-assertion tests, never by a status-code check (the page still returned 200). Fixed on the
caller side (workspace-teams-hierarchy.html): th:each now lives on its own <th:block>, with
th:replace on a separate, nested <li> — the standard, unambiguous Thymeleaf idiom for "iterate,
then replace each iteration with a fragment" (the two attributes must never share one tag). This
fragment's own parameter is still named memberAccountId, not accountId, purely as a second,
independent layer of defense against a caller-side name collision — not the actual fix.

SonarCloud finding, 2026-09-29: "Surround this <li> item tag by a <ul>, <ol> or <menu> container
one" — the analyzer reads this file's own raw source, where the <li> below has no such parent; it
has no way to see that every real caller only ever th:replaces it into a <ul> it doesn't define
here (workspace-teams-hierarchy.html's own two call sites). Same "satisfy the raw-source check
directly, don't suppress it" posture the static for/id fallback pairs elsewhere in this module
already establish. The <ul> wrapper below is never actually rendered: Thymeleaf's th:replace only
ever extracts the element carrying th:fragment itself (the <li>), never its ancestors — this <ul>
exists purely so a static analyzer reading the file in isolation sees valid structure.

Live UX request, 2026-09-29: forceConfirmAccountId — when it equals this row's own memberAccountId
(PlatformWorkspaceController#unassignMemberFromRole just caught CannotDemoteLastAdminException for
THIS account), the plain "Remove" button is replaced by an inline "type unassign to confirm" form
posting to the exact same URL with confirmedAction=unassign added — see
ChangeWorkspaceMemberRoleCommand#force()'s own Javadoc for why the dashboard is allowed to bypass
that guard on explicit confirmation. null for every other row (the common case), same as before. -->
<ul>
<li class="clavaris-row-actions"
    th:fragment="row(organization, workspace, memberAccountId, label, forceConfirmAccountId)">
    <span th:text="${label}">Account name</span>
    <form th:unless="${forceConfirmAccountId == memberAccountId}" method="post"
          th:action="@{/platform/dashboard/organizations/{organizationId}/workspaces/{workspaceId}/members/{accountId}/unassign-role(organizationId=${organization.id()},workspaceId=${workspace.id()},accountId=${memberAccountId})}"
          th:attr="hx-post=@{/platform/dashboard/organizations/{organizationId}/workspaces/{workspaceId}/members/{accountId}/unassign-role(organizationId=${organization.id()},workspaceId=${workspace.id()},accountId=${memberAccountId})}"
          hx-target="#teams-hierarchy-content" hx-swap="outerHTML">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="clavaris-button clavaris-button--secondary clavaris-button--inline" type="submit">Remove</button>
    </form>
    <form th:if="${forceConfirmAccountId == memberAccountId}" class="clavaris-row-actions" method="post"
          th:action="@{/platform/dashboard/organizations/{organizationId}/workspaces/{workspaceId}/members/{accountId}/unassign-role(organizationId=${organization.id()},workspaceId=${workspace.id()},accountId=${memberAccountId})}"
          th:attr="hx-post=@{/platform/dashboard/organizations/{organizationId}/workspaces/{workspaceId}/members/{accountId}/unassign-role(organizationId=${organization.id()},workspaceId=${workspace.id()},accountId=${memberAccountId})}"
          hx-target="#teams-hierarchy-content" hx-swap="outerHTML">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <!-- Static "for"/"id" fallback below, overridden by th:for/th:id at render time — same
             static-analyzer-blind-spot convention this module's other per-row fields document. -->
        <label class="clavaris-visually-hidden" for="confirm-unassign" th:for="${'confirm-unassign-' + memberAccountId}">Type "unassign" to confirm</label>
        <input type="text" name="confirmedAction" id="confirm-unassign" th:id="${'confirm-unassign-' + memberAccountId}"
               placeholder="unassign" autocomplete="off" required/>
        <button class="clavaris-button clavaris-button--secondary clavaris-button--inline" type="submit">Confirm</button>
    </form>
</li>
</ul>
