<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{organization/fragments/head :: head(${organization.name()} + ' — Clavaris')}">
    <title>Organization — Clavaris</title>
</head>
<body>
<div class="clavaris-dashboard">
    <aside th:replace="~{organization/platform/fragments/dashboard-nav :: sidebar('organizations')}"></aside>
    <main class="clavaris-dashboard__content">
        <div class="clavaris-dashboard__inner">
            <p class="clavaris-breadcrumb"><a th:href="@{/platform/dashboard}">Organizations</a> / <span th:text="${organization.name()}">Organization</span></p>

            <div class="clavaris-page-header">
                <div>
                    <h1 th:text="${organization.name()}">Organization name</h1>
                    <p>
                        <span class="clavaris-badge"
                              th:classappend="${organization.environment().name() == 'PRODUCTION'} ? 'clavaris-badge--success' : 'clavaris-badge--muted'"
                              th:text="${organization.environment()}">DEVELOPMENT</span>
                        &#183; Created <span th:text="${T(com.clavaris.common.domain.model.LongEnglishDateFormatter).format(organization.createdAt())}">date</span>
                    </p>
                    <!-- SDE-III review, 2026-09-18: previously shown nowhere as text on this whole
                         dashboard — only ever implicit in every sub-page's own URL — despite every
                         REST admin API call and OAuth Client setup instructions needing it typed in
                         by hand. Plain selectable <code>, same convention this page's own OAuth
                         Client/Secret Key/Signing Key screens already use for copyable values;
                         no clipboard JS added (none exists anywhere in this codebase today, and one
                         value doesn't earn introducing that infrastructure). -->
                    <p>Organization ID: <code th:text="${organization.id()}">organization id</code></p>
                </div>
            </div>

            <div th:replace="~{organization/platform/fragments/org-tabs :: tabs(${organization.id()}, 'workspaces')}"></div>

            <!-- ADR-0025: same HTMX-fragment shape as dashboard.html's own "content" div — the
                 create-workspace form below posts to PlatformWorkspaceController#create, which
                 re-renders just this whole fragment (updated table + a fresh, blank form) when the
                 request carries HX-Request; a real full-page GET produces the exact same markup. -->
            <div id="workspaces-content" th:fragment="workspaces" class="clavaris-section">
                <h2>Workspaces</h2>
                <div class="clavaris-section-card" th:if="${#lists.isEmpty(workspaces)}">
                    <p class="clavaris-empty-state">No workspaces yet — create your first one below.</p>
                </div>
                <div class="clavaris-table-wrapper" th:unless="${#lists.isEmpty(workspaces)}">
                    <table class="clavaris-table">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Created</th>
                            <th><span class="clavaris-visually-hidden">Actions</span></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="workspace : ${workspaces}">
                            <td th:text="${workspace.name()}">Workspace name</td>
                            <td th:text="${T(com.clavaris.common.domain.model.LongEnglishDateFormatter).format(workspace.createdAt())}">Created at</td>
                            <td>
                                <a class="clavaris-button clavaris-button--secondary clavaris-button--inline"
                                   th:href="@{/platform/dashboard/organizations/{organizationId}/workspaces/{workspaceId}(organizationId=${organization.id()},workspaceId=${workspace.id()})}">View</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- TD-PERF-020 (keyset revision, 2026-09-14): same keyset pagination shape as
                     dashboard.html's own Organizations table — see
                     PlatformOrganizationDetailController's own Javadoc. -->
                <nav class="clavaris-pagination"
                     th:if="${workspacesPage.hasPrevious() or workspacesPage.hasNext()}"
                     aria-label="Workspaces pages">
                    <a class="clavaris-button clavaris-button--secondary clavaris-button--inline"
                       th:if="${workspacesPage.hasPrevious()}"
                       th:href="@{/platform/dashboard/organizations/{organizationId}(organizationId=${organization.id()},before=${workspacesPage.startCursor().encode()})}"
                       th:attr="hx-get=@{/platform/dashboard/organizations/{organizationId}(organizationId=${organization.id()},before=${workspacesPage.startCursor().encode()})}"
                       hx-target="#workspaces-content" hx-swap="outerHTML">Previous</a>
                    <a class="clavaris-button clavaris-button--secondary clavaris-button--inline"
                       th:if="${workspacesPage.hasNext()}"
                       th:href="@{/platform/dashboard/organizations/{organizationId}(organizationId=${organization.id()},after=${workspacesPage.endCursor().encode()})}"
                       th:attr="hx-get=@{/platform/dashboard/organizations/{organizationId}(organizationId=${organization.id()},after=${workspacesPage.endCursor().encode()})}"
                       hx-target="#workspaces-content" hx-swap="outerHTML">Next</a>
                </nav>

                <div class="clavaris-section-card">
                    <form th:action="@{/platform/dashboard/organizations/{organizationId}/workspaces(organizationId=${organization.id()})}"
                          th:object="${workspaceForm}" method="post"
                          th:attr="hx-post=@{/platform/dashboard/organizations/{organizationId}/workspaces(organizationId=${organization.id()})}"
                          hx-target="#workspaces-content" hx-swap="outerHTML">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="clavaris-field">
                            <label for="workspace-name">New workspace name</label>
                            <input id="workspace-name" type="text" th:field="*{name}" required/>
                            <p class="clavaris-field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>
                        </div>

                        <button class="clavaris-button clavaris-button--inline" type="submit">Create workspace</button>
                    </form>
                </div>
            </div>

        </div>
    </main>
</div>
<script th:src="${#resourceUrl != null ? #resourceUrl.url('/js/htmx.min.js') : '/js/htmx.min.js'}" defer></script>
</body>
</html>
