name: CI

# git-workflow.md §4: every change goes through a PR gated by this workflow —
# no direct commits to master are pushed here, but branch-protection (a
# GitHub repo setting, not something a workflow file can enforce) is what
# actually blocks them; this workflow is the "all green" half of that gate.
# Branch is "master" — this repo's actual default branch (kept as-is,
# deliberately not renamed to "main").
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege default — jobs opt into anything broader explicitly instead
# of inheriting write access they don't need.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, unit/integration/ArchUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Integration tests use Testcontainers (test-strategy.md §2), which
      # drives the Docker daemon directly rather than GitHub Actions'
      # `services:` block — ubuntu-latest runners ship Docker preinstalled,
      # so no extra setup is needed here.
      #
      # ArchUnit's hexagonal-dependency check (coding-standards.md §2,
      # test-strategy.md §2) runs as an ordinary test class picked up by
      # `mvn verify` below — there is no separate ArchUnit CI step by design,
      # matching "run in CI on every build, not a manual review step."
      - name: Build and test (mvn verify)
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*"
          if-no-files-found: ignore

  docker-build:
    name: Build the app image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      # Not pushed anywhere yet — this job exists to catch Dockerfile/pom
      # drift (a Dockerfile that stops building) as a CI failure instead of
      # a surprise the first time someone tries to deploy.
      - name: Build app image
        run: docker build -f app/Dockerfile -t clavaris-app:ci .

      # TD-SEC-021: distinct from dependency-scan below (Java/Maven dependencies only) — this
      # scans the actual OS-level packages inside the built image (eclipse-temurin:25-jre's own
      # Debian base), the layer dependency-scan never touches at all. exit-code 1 on
      # CRITICAL/HIGH mirrors dependency-scan's own -DfailBuildOnCVSS=7 gate — same bar, applied
      # to the other half of the supply chain. UNKNOWN/LOW/MEDIUM findings are reported (via the
      # uploaded artifact below) but don't fail the build, same "close what's actionable and
      # severe, don't block on noise" stance security-architecture.md already takes elsewhere.
      - name: Trivy container image scan
        # Real bug, confirmed live: the initial pin (0.28.0, no "v" prefix) doesn't match this
        # action's actual tagging convention — GitHub Actions failed to resolve it outright before
        # this workflow ever ran. Verified the real tag list against GitHub's own API
        # (api.github.com/repos/aquasecurity/trivy-action/tags) rather than guessing again: every
        # release is v-prefixed, v0.36.0 is the current latest.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: clavaris-app:ci
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          # TD-SEC-024: verified live (source, not assumed) that the action does NOT fall back to
          # the underlying `trivy` CLI's own ".trivyignore in cwd" default — its entrypoint only
          # sets TRIVY_IGNOREFILE when this input is explicitly given. Without it, the repo-root
          # .trivyignore silently does nothing and the 7 already-risk-accepted Go-stdlib CVEs in
          # the Infisical CLI binary (ADR-0014) fail this step every run.
          trivyignores: .trivyignore

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Compute cache week
        id: week
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      # Cached NVD data survives across runs — without it, a rate-limited or
      # transiently failed NVD update (see below) leaves the scanner with
      # zero fallback data and it fails outright ("NoDataException: No
      # documents exist"), confirmed live on this exact CI run. Weekly cache
      # key: refreshes periodically without redownloading the ~multi-GB
      # dataset on every single build. Path must match -DdataDirectory below
      # exactly, or the cache silently caches the wrong directory.
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v6
        with:
          path: ~/.dependency-check-data
          key: depcheck-nvd-${{ steps.week.outputs.week }}
          restore-keys: depcheck-nvd-

      # security-architecture.md §8 / git-workflow.md §4: dependency
      # vulnerability scanning is a required CI gate, not a "nice to have."
      # NVD_API_KEY confirmed live (auth works). A cold-cache full sync
      # (~380k records) confirmed live at two different costs: first hit
      # repeated 503s until retries were exhausted (transient NVD-side
      # outage), then — even once NVD itself was healthy — took 5 hours,
      # an unacceptable blocking cost on an ordinary push. Root cause of the
      # 5 hours: this job both restores AND is the only thing that ever
      # populates the weekly cache below, so any push that's first to hit a
      # new/evicted cache pays the full cold-sync cost inline, gating real
      # work behind it.
      # Fix: nvd-cache-refresh.yml now pre-warms this exact cache key on a
      # weekly schedule, decoupling the slow full sync from this gate — by
      # the time an ordinary push runs, this step should almost always find
      # a warm cache and only need a small incremental update (seconds, not
      # hours). This job's own restore step stays as a safety net (still
      # correct on a cold cache, just slow), not the primary way the cache
      # gets populated. nvdApiDelay=2000: NVD's documented limit for
      # API-key holders is 50 requests/rolling 30s (≈600ms minimum
      # spacing) — 2000ms keeps a ~3x safety margin against triggering
      # NVD's own throttling while running noticeably faster than the
      # 6000ms this replaces (matches nvd-cache-refresh.yml's own value, so
      # both jobs behave consistently against NVD).
      # nvdApiKeyEnvironmentVariable: the plugin's own recommended CI
      # pattern, instead of passing the key as a -D value directly.
      # `dependency-check:check` invoked as a bare goal (no lifecycle phase)
      # does not package any module first: "app" declares common/identity-
      # module/organization-module/client-registry-module as compile-scope
      # dependencies, and with no prior `package`, none of those .jars exist
      # anywhere this job can find them — confirmed live ("Could not find
      # artifact com.clavaris:common:jar..."). `package` first, in the SAME
      # mvn invocation, makes each module's jar available to the reactor
      # before the module that depends on it needs it (the same mechanism
      # every `mvn verify` elsewhere in this workflow already relies on).
      # -DskipTests: this job scans dependencies, it doesn't need to
      # re-run the test suite build-and-test already covers.
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B package -DskipTests org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=7
          -DdataDirectory=$HOME/.dependency-check-data
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DnvdApiDelay=2000

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: "**/target/dependency-check-report.html"
          if-no-files-found: ignore

  doc-consistency:
    name: Documentation consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # definition-of-done.md §1a: catches the exact class of bug that
      # happened once already (ADR-0010 shipped, five other docs kept
      # contradicting it). Cheap, deliberately not exhaustive — see the
      # script's own header for what it does and doesn't catch.
      - name: Run doc consistency checks
        run: ./scripts/check-doc-consistency.sh

  sonarcloud:
    name: SonarCloud analysis (Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud's new-code/blame analysis needs real history, not the
          # single-commit shallow clone checkout defaults to.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Cache SonarCloud analysis cache
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Runs the full test suite (mvn verify — same as build-and-test) so
      # JaCoCo's coverage report exists before Sonar reads it, then uploads
      # analysis + coverage in one pass. sonar.qualitygate.wait=true makes
      # this step itself fail — and this whole job fail — the moment
      # SonarCloud's Quality Gate comes back red, not just "analysis ran."
      #
      # Explicit sonar.coverage.jacoco.xmlReportPaths — this is the SECOND
      # attempt at this exact problem, the first one (a **-glob pointed at
      # app/target/site/jacoco-aggregate/jacoco.xml) confirmed live NOT to
      # work: SonarCloud still reported the same files at 0.0% afterwards.
      # Root cause, confirmed against SonarSource's own community docs on
      # this exact scenario: this property is resolved separately for EACH
      # module, relative to THAT module's own basedir — a `**` glob can only
      # ever search within a module's own subtree, so from
      # identity-module's own analysis context it could never reach
      # app/target/..., a sibling directory, no matter how the glob was
      # written. The fix the docs describe ("set this property in every
      # module on which the coverage should be imported") means an explicit
      # path that's actually reachable from each module's own basedir —
      # ../app/... — not a glob.
      #
      # The underlying gap this exists for: RegisterAccountIntegrationTest
      # lives in app/, not identity-module/, because it needs the full
      # Spring context + aggregated Flyway migrations only app has (same
      # reasoning as FlywayMigrationIntegrationTest). It genuinely exercises
      # identity-module's persistence adapters end to end against a real
      # Postgres, but identity-module's own default report only ever
      # correlates identity-module's own exec data against its own compiled
      # classes. app/pom.xml's report-aggregate execution (run only there,
      # since app is the one module that already depends on every business
      # module) combines every reactor module's exec data against every
      # dependency's own compiled classes into one file at
      # app/target/site/jacoco-aggregate/jacoco.xml; every business module
      # is a direct child of the repo root, so ../app/... resolves correctly
      # from any of their basedirs (including app's own — app/../app/...
      # normalises back to itself).
      #
      # Setup (git-workflow.md §4a): project created at sonarcloud.io,
      # projectKey/organization below are real values, and SONAR_TOKEN is
      # confirmed added as a repo secret (2026-08-18). Branch protection on
      # `master` requiring the `ci-passed` aggregator job below (not this
      # job individually) is a GitHub repo setting only an admin can
      # configure — nothing in this workflow file can set that from here.
      - name: Build, test, and analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.projectKey=RedeArmy_Clavaris
          -Dsonar.organization=redearmy
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,../app/target/site/jacoco-aggregate/jacoco.xml

      # Expected, harmless log noise from the step above, not a real gap:
      # "No coverage report can be found with sonar.coverage.jacoco.xmlReportPaths=...".
      # Confirmed live (ls'd every module's target/site/jacoco/jacoco.xml after a real
      # `mvn clean verify`): every module with actual classes produces one correctly;
      # `common` is the sole exception, because it currently has zero classes and zero
      # tests (still just placeholder folders) — there is no coverage data to report in
      # the first place, not a broken report path. Revisit once `common` gains real code.
      #
      # Also expected, also harmless: "The Data Dictionary is not configured for the
      # PLSQL analyzer, which prevents rule(s) S3641, S3921, S3618, S3651 from raising
      # issues." SonarCloud's PL/SQL (SonarPLSQL) analyzer runs against every `.sql` file
      # it sees regardless of dialect, including Flyway's plain Postgres DDL migrations
      # here — there is no per-dialect opt-out, only a full Data Dictionary connection.
      # Confirmed against SonarSource's own docs: the Data Dictionary is a live JDBC
      # connection to a real Oracle database (querying SYS.ALL_TAB_COLUMNS and similar
      # views) that those four rules need to resolve table/column metadata — explicitly
      # Oracle-only, with no PostgreSQL equivalent. This project has zero Oracle PL/SQL
      # anywhere (ADR-0004: PostgreSQL) and never will, so there is no Data Dictionary to
      # configure and nothing these four rules could ever check here — not a
      # misconfiguration, a mismatch between a generic file-extension-triggered analyzer
      # and a project that was never going to use the one database engine it targets.

  # Branch protection needs to require exactly one status check, not five —
  # requiring each job individually breaks silently the moment any one of
  # them is renamed (GitHub keeps requiring the old name forever, and the
  # PR sits unmergeable with no obvious reason why) and, until this job
  # existed, would have made setup itself a five-item checklist to keep in
  # sync by hand. This job depends on all five and only succeeds if every
  # one of them did — branch protection requires only "CI Passed"
  # (git-workflow.md §4). Runs in parallel with nothing to wait on itself,
  # so it adds no wall-clock time beyond whichever upstream job is slowest.
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      [build-and-test, docker-build, dependency-scan, doc-consistency, sonarcloud]
    # Without this, a failure in any `needs` job skips this one entirely —
    # a "skipped" required check leaves a PR stuck pending forever instead
    # of showing a clear red ✗, which is confusing to debug from the PR
    # page alone. always() makes this job run regardless, so it can report
    # an explicit, visible failure.
    if: always()
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo "build-and-test:    ${{ needs.build-and-test.result }}"
          echo "docker-build:      ${{ needs.docker-build.result }}"
          echo "dependency-scan:   ${{ needs.dependency-scan.result }}"
          echo "doc-consistency:   ${{ needs.doc-consistency.result }}"
          echo "sonarcloud:        ${{ needs.sonarcloud.result }}"
          if [ "${{ needs.build-and-test.result }}" != "success" ] ||
             [ "${{ needs.docker-build.result }}" != "success" ] ||
             [ "${{ needs.dependency-scan.result }}" != "success" ] ||
             [ "${{ needs.doc-consistency.result }}" != "success" ] ||
             [ "${{ needs.sonarcloud.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed — failing the aggregate check."
            exit 1
          fi
