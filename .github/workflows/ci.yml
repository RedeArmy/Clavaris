name: CI

# git-workflow.md §4: every change goes through a PR gated by this workflow —
# no direct commits to master are pushed here, but branch-protection (a
# GitHub repo setting, not something a workflow file can enforce) is what
# actually blocks them; this workflow is the "all green" half of that gate.
# Branch is "master" — this repo's actual default branch (kept as-is,
# deliberately not renamed to "main").
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege default — jobs opt into anything broader explicitly instead
# of inheriting write access they don't need.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, unit/integration/ArchUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Integration tests use Testcontainers (test-strategy.md §2), which
      # drives the Docker daemon directly rather than GitHub Actions'
      # `services:` block — ubuntu-latest runners ship Docker preinstalled,
      # so no extra setup is needed here.
      #
      # ArchUnit's hexagonal-dependency check (coding-standards.md §2,
      # test-strategy.md §2) runs as an ordinary test class picked up by
      # `mvn verify` below — there is no separate ArchUnit CI step by design,
      # matching "run in CI on every build, not a manual review step."
      - name: Build and test (mvn verify)
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*"
          if-no-files-found: ignore

  docker-build:
    name: Build the app image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      # Not pushed anywhere yet — this job exists to catch Dockerfile/pom
      # drift (a Dockerfile that stops building) as a CI failure instead of
      # a surprise the first time someone tries to deploy.
      - name: Build app image
        run: docker build -f app/Dockerfile -t clavaris-app:ci .

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compute cache week
        id: week
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      # Cached NVD data survives across runs — without it, a rate-limited or
      # transiently failed NVD update (see below) leaves the scanner with
      # zero fallback data and it fails outright ("NoDataException: No
      # documents exist"), confirmed live on this exact CI run. Weekly cache
      # key: refreshes periodically without redownloading the ~multi-GB
      # dataset on every single build. Path must match -DdataDirectory below
      # exactly, or the cache silently caches the wrong directory.
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: depcheck-nvd-${{ steps.week.outputs.week }}
          restore-keys: depcheck-nvd-

      # security-architecture.md §8 / git-workflow.md §4: dependency
      # vulnerability scanning is a required CI gate, not a "nice to have."
      # Without NVD_API_KEY, unauthenticated NVD API rate limits are tight
      # enough that the update can fail outright on a cold cache, not just
      # run slower as this comment previously (wrongly) claimed — confirmed
      # live. Get a free key at https://nvd.nist.gov/developers/request-an-api-key
      # and add it as the NVD_API_KEY repo secret; the cache above is a
      # safety net for when the update still fails occasionally, not a
      # substitute for having a key. Bumped 10.0.4 → 13.0.0: the NVD API v2.0
      # client in 10.0.4 is old enough to plausibly be the source of the
      # NullPointerException seen in that failed update, independent of the
      # rate-limit question.
      - name: OWASP Dependency-Check
        run: >
          mvn -B org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=7
          -DdataDirectory=$HOME/.dependency-check-data
          -Dnvd.api.key=${{ secrets.NVD_API_KEY }}

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: "**/target/dependency-check-report.html"
          if-no-files-found: ignore

  doc-consistency:
    name: Documentation consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # definition-of-done.md §1a: catches the exact class of bug that
      # happened once already (ADR-0010 shipped, five other docs kept
      # contradicting it). Cheap, deliberately not exhaustive — see the
      # script's own header for what it does and doesn't catch.
      - name: Run doc consistency checks
        run: ./scripts/check-doc-consistency.sh

  sonarcloud:
    name: SonarCloud analysis (Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud's new-code/blame analysis needs real history, not the
          # single-commit shallow clone checkout defaults to.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Cache SonarCloud analysis cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Runs the full test suite (mvn verify — same as build-and-test) so
      # JaCoCo's coverage report exists before Sonar reads it, then uploads
      # analysis + coverage in one pass. sonar.qualitygate.wait=true makes
      # this step itself fail — and this whole job fail — the moment
      # SonarCloud's Quality Gate comes back red, not just "analysis ran."
      #
      # REQUIRES SETUP BEFORE THIS JOB CAN PASS (git-workflow.md §4a):
      #  1. Create the project at https://sonarcloud.io (import this GitHub repo).
      #  2. Replace sonar.projectKey / sonar.organization below with the real
      #     values SonarCloud assigns.
      #  3. Add SONAR_TOKEN as a repo secret (Settings → Secrets and
      #     variables → Actions) — generate it from SonarCloud's own
      #     My Account → Security → Generate Token.
      #  4. Enable Branch Protection on `master` (Settings → Branches) and
      #     require this job ("SonarCloud analysis (Quality Gate)") — and
      #     the other CI jobs — to pass before merging. Neither this file nor
      #     Claude Code can set that from here; it's a GitHub repo setting
      #     only a repo admin can configure.
      - name: Build, test, and analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.projectKey=TODO_REPLACE_WITH_SONARCLOUD_PROJECT_KEY
          -Dsonar.organization=TODO_REPLACE_WITH_SONARCLOUD_ORG_KEY
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
