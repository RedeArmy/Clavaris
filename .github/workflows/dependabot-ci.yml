name: Dependabot CI (secrets-gated checks)

# TD-SEC-027: GitHub withholds the repository's Actions secrets from `pull_request` runs whose PR was
# opened by dependabot[bot] (the same restriction as a fork PR, on purpose, so a bad dependency bump
# cannot read a secret through CI). A real Dependabot run of ci.yml failed NVD_API_KEY and
# SONAR_TOKEN with "length of 0" while the same NVD_API_KEY worked under nvd-cache-refresh.yml, which
# ruled out the secret itself.
#
# These two jobs used to get around that with `pull_request_target`. GitHub is blocking that event
# for public repositories (brownouts from November 2026, enforced on 2 December 2026), so this file
# now uses the mechanism GitHub documents for the case: plain `pull_request`, with the two secrets
# stored under Settings > Secrets and variables > Dependabot. A run started by dependabot[bot]
# reads that store (and only that store); a run of any other PR does not get these values at all.
#
# What keeps this safe:
#   1. The secrets sit in the Dependabot store, not in the Actions store. Only a pull request opened
#      by dependabot[bot] can read them, and Dependabot changes manifests, not workflow files.
#   2. Every job below is gated on `github.event.pull_request.user.login == 'dependabot[bot]'`, the
#      PR's own author field, which cannot be spoofed the way a commit author can. Deliberately NOT
#      `github.actor`: that is whoever triggered THIS run, so it turns into the maintainer's name the
#      moment someone clicks "Re-run jobs", and the check silently stopped matching on every re-run.
#      For any other author these jobs are skipped before a checkout happens.
#   3. The token is read-only (`permissions: contents: read` below), and SONAR_TOKEN is given only to
#      the step that runs the analysis, never to the step that builds the pull request's code.
#
# Deliberately a SEPARATE workflow, not a change of ci.yml's own trigger: `docker-build` runs
# `docker build` against the PR's own Dockerfile, and no job that never needed a secret should have
# one in its environment.
#
# This file lives apart from ci.yml's `ci-passed` aggregator, so `needs:` cannot reach across files:
# `dependabot-security-gate` below is a SECOND required status check (next to "CI Passed", not
# replacing it). ci.yml's own dependency-scan/sonarcloud jobs report a deliberate, explained
# "skipped" (not a failure) for a Dependabot PR; the real check for that PR happens here.
#
# SETUP (a person has to do this, once): add NVD_API_KEY and SONAR_TOKEN as Dependabot secrets, with
# the same values as the Actions ones. Without them both jobs fail on an empty value and the gate
# stays red, which is the safe direction.

on:
  pull_request:
    branches: [master]

# Least-privilege: read-only contents is all any step below needs (checkout + build + scan). No job
# here writes to the repository, comments on the PR, or requests any broader scope — same posture as
# ci.yml's own top-level permissions block.
permissions:
  contents: read

# Cancels a superseded run the moment Dependabot pushes a new commit to the same PR (e.g. its own
# rebase) — avoids two overlapping runs burning real NVD API quota, and avoids a stale run's result
# being what actually gates a merge.
concurrency:
  group: dependabot-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency vulnerability scan (Dependabot)
    runs-on: ubuntu-latest
    # A hung step otherwise runs for GitHub's default six hours of runner time.
    timeout-minutes: 60
    # The actual trust boundary — see this file's own header for why this checks the PR's own
    # author, not github.actor. Every step below only ever runs when that author is the real,
    # GitHub-verified dependabot[bot]; for anyone else this job is skipped outright, before even a
    # checkout happens.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Compute cache week
        id: week
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      # Same cache key ci.yml's own dependency-scan job and nvd-cache-refresh.yml both read/write —
      # a Dependabot PR benefits from the same weekly-warmed cache, same reasoning as both of those.
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.dependency-check-data
          key: depcheck-nvd-${{ steps.week.outputs.week }}
          restore-keys: depcheck-nvd-

      # Identical invocation to ci.yml's own dependency-scan step — see that file's own comments
      # for why each flag is set the way it is; not repeated here.
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B package -DskipTests org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=7
          "-DdataDirectory=$HOME/.dependency-check-data"
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DnvdApiDelay=2000
          -DsuppressionFiles=owasp-suppressions.xml

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependabot-dependency-check-report
          path: "**/target/dependency-check-report.html"
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud analysis (Dependabot)
    runs-on: ubuntu-latest
    # A hung step otherwise runs for GitHub's default six hours of runner time.
    timeout-minutes: 30
    # Same PR-author check, same reasoning, as dependency-scan's own identical condition above.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarCloud's new-code/blame analysis needs real history, not the single-commit shallow
          # clone checkout defaults to — same as ci.yml's own sonarcloud job.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Cache SonarCloud analysis cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # TD-PROC-012: this job no longer runs the test suite. ci.yml's build-and-test already runs it
      # for every pull request, Dependabot's included (that workflow needs no secret, so it is
      # triggered normally), and a second run only produced the coverage report, at the cost of a
      # second chance for a test that fails now and then to fail the Dependabot Security Gate. So the
      # tests, and with them Testcontainers and the Docker Hub mirror, are not needed here.
      #
      # Not running them does not weaken the Quality Gate for this kind of pull request: its six
      # conditions all concern new code (ratings, new coverage, new duplication, hotspots reviewed),
      # and a Dependabot pull request changes manifests (pom.xml, compose files, workflows) that
      # have no lines to cover, so the coverage condition has nothing to evaluate.
      #
      # Compiles, packages and runs the static checks, with no secret in the environment: this is
      # the step that executes the pull request's own build, so it must not see SONAR_TOKEN (before,
      # `mvn verify` ran the pull request's tests with the token set).
      - name: Build without running the tests
        run: mvn -B -ntp -DskipTests verify

      # Identical analysis to ci.yml's own sonarcloud step — see that file's own comments for the
      # full reasoning behind each property (including the 2026-09-04 sonar.sources/
      # sonar.plsql.file.suffixes additions). Only this step gets the token.
      - name: Analyse with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.projectKey=RedeArmy_Clavaris
          -Dsonar.organization=redearmy
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
          -Dsonar.sources=src/main/java,src/main/resources
          -Dsonar.plsql.file.suffixes=

  dependabot-security-gate:
    name: Dependabot Security Gate
    runs-on: ubuntu-latest
    # A hung step otherwise runs for GitHub's default six hours of runner time.
    timeout-minutes: 10
    needs: [dependency-scan, sonarcloud]
    # Always runs, same "if: always() — a skipped required job otherwise leaves the PR stuck
    # pending forever, not a clear ✗" reasoning as ci.yml's own ci-passed job. Covers both real
    # outcomes: a non-Dependabot PR (both needs are cleanly "skipped" by the author gate above —
    # nothing to report here, ci.yml's own "CI Passed" is the real gate for that PR) and an actual
    # Dependabot PR (both needs must have genuinely succeeded).
    if: always()
    steps:
      - name: Evaluate gate
        env:
          # github.event.pull_request.user.login, NOT github.actor — same real bug/fix as both
          # jobs' own `if:` above.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          SONARCLOUD_RESULT: ${{ needs.sonarcloud.result }}
        run: |
          echo "PR author:        $PR_AUTHOR"
          echo "dependency-scan:  $DEPENDENCY_SCAN_RESULT"
          echo "sonarcloud:       $SONARCLOUD_RESULT"
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            echo "Not a Dependabot PR — this gate does not apply here, passing."
            exit 0
          fi
          if [ "$DEPENDENCY_SCAN_RESULT" != "success" ] || [ "$SONARCLOUD_RESULT" != "success" ]; then
            echo "One or more required checks did not succeed for this Dependabot PR — failing."
            exit 1
          fi
