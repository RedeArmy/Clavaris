version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # TD-PROC-014: the compose files pin postgres, redis and caddy by digest; without this ecosystem
  # those pins never move and a base-image change arrives unreviewed (or never).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # TD-PROC-020: a PostgreSQL major version cannot start on the previous major's data directory,
    # so a bump that merges green still takes the database down on the host that holds real data.
    # Patch and minor updates still arrive; a major upgrade is a planned dump and restore, by hand.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # TD-PROC-033: the Playwright tests' own dependencies had no update path at all.
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
